<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad14" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cardGrad14" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadowBox14" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad14)"/>
  <g stroke="#1E293B" stroke-width="1" stroke-dasharray="6 6" opacity="0.4">
    <line x1="0" y1="140" x2="1280" y2="140"/>
    <line x1="0" y1="580" x2="1280" y2="580"/>
    <line x1="330" y1="0" x2="330" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="950" y1="0" x2="950" y2="720"/>
  </g>

  <!-- Header Banner -->
  <rect x="50" y="30" width="1180" height="70" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2" filter="url(#shadowBox14)"/>
  <rect x="65" y="45" width="8" height="40" rx="4" fill="#10B981"/>
  <text x="85" y="65" fill="#34D399" font-family="'Stack Sans Notch', sans-serif" font-weight="900" font-size="14" letter-spacing="3">UNIT 14 • BASE64 NETWORK ENCODING PIPELINE SIMULATION</text>
  <text x="85" y="87" fill="#F8FAFC" font-family="'Mitr', sans-serif" font-weight="700" font-size="20">กระบวนการแปลงรหัสไบนารี 8 บิต สู่ Base64 6 บิตเพื่อความปลอดภัยในเครือข่าย</text>

  <!-- Connectors -->
  <g stroke="#10B981" stroke-width="3" fill="none" opacity="0.8">
    <path d="M 320 370 L 370 370" stroke-dasharray="8 4"/>
    <path d="M 630 370 L 680 370" stroke-dasharray="8 4"/>
    <path d="M 940 370 L 990 370" stroke-dasharray="8 4"/>
  </g>

  <!-- STAGE 1: 8-Bit Binary Stream -->
  <g transform="translate(60, 140)" filter="url(#shadowBox14)">
    <rect width="260" height="460" rx="16" fill="url(#cardGrad14)" stroke="#10B981" stroke-width="2"/>
    <circle cx="45" cy="45" r="22" fill="#059669"/>
    <text x="45" y="52" fill="#FFFFFF" font-family="'Stack Sans Notch', sans-serif" font-weight="900" font-size="18" text-anchor="middle">1</text>
    <text x="80" y="50" fill="#FFFFFF" font-family="'Mitr', sans-serif" font-weight="700" font-size="16">สายข้อมูล 8 บิต</text>
    <text x="80" y="68" fill="#94A3B8" font-family="'Stack Sans Notch', sans-serif" font-size="12">8-Bit Binary Stream</text>

    <!-- Visual 3 Bytes = 24 Bits -->
    <rect x="30" y="100" width="200" height="200" rx="12" fill="#090D16" stroke="#059669" stroke-width="1.5"/>
    <rect x="40" y="125" width="180" height="35" rx="6" fill="#064E3B"/>
    <text x="130" y="148" fill="#6EE7B7" font-family="monospace" font-size="12" text-anchor="middle">'M' = 01001101</text>
    <rect x="40" y="170" width="180" height="35" rx="6" fill="#064E3B"/>
    <text x="130" y="193" fill="#6EE7B7" font-family="monospace" font-size="12" text-anchor="middle">'a' = 01100001</text>
    <rect x="40" y="215" width="180" height="35" rx="6" fill="#064E3B"/>
    <text x="130" y="238" fill="#6EE7B7" font-family="monospace" font-size="12" text-anchor="middle">'n' = 01101110</text>
    <text x="130" y="280" fill="#A7F3D0" font-family="'Stack Sans Notch', sans-serif" font-size="11" text-anchor="middle">Total: 3 Bytes (24 Bits)</text>

    <rect x="25" y="320" width="210" height="115" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="35" y="345" fill="#E2E8F0" font-family="'Mitr', sans-serif" font-size="13" font-weight="600">• ข้อมูลดิบหรือรูปภาพ/ไฟล์</text>
    <text x="35" y="372" fill="#94A3B8" font-family="'Mitr', sans-serif" font-size="12">• เรียงเป็นไบนารีกลุ่มละ 8 บิต</text>
    <text x="35" y="399" fill="#94A3B8" font-family="'Mitr', sans-serif" font-size="12">• มีอักขระควบคุมที่ส่งยาก</text>
    <text x="35" y="423" fill="#34D399" font-family="'Mitr', sans-serif" font-size="11" font-weight="600">[Raw 8-Bit Stream]</text>
  </g>

  <!-- STAGE 2: 6-Bit Partitioning -->
  <g transform="translate(370, 140)" filter="url(#shadowBox14)">
    <rect width="260" height="460" rx="16" fill="url(#cardGrad14)" stroke="#06B6D4" stroke-width="2"/>
    <circle cx="45" cy="45" r="22" fill="#0891B2"/>
    <text x="45" y="52" fill="#FFFFFF" font-family="'Stack Sans Notch', sans-serif" font-weight="900" font-size="18" text-anchor="middle">2</text>
    <text x="80" y="50" fill="#FFFFFF" font-family="'Mitr', sans-serif" font-weight="700" font-size="16">แบ่งกลุ่มใหม่เป็น 6 บิต</text>
    <text x="80" y="68" fill="#94A3B8" font-family="'Stack Sans Notch', sans-serif" font-size="12">6-Bit Chunking</text>

    <!-- Visual 4 Chunks of 6 Bits -->
    <rect x="30" y="100" width="200" height="200" rx="12" fill="#090D16" stroke="#0891B2" stroke-width="1.5"/>
    <text x="50" y="140" fill="#A5F3FC" font-family="monospace" font-size="12">[1] 010011 (19)</text>
    <text x="50" y="175" fill="#A5F3FC" font-family="monospace" font-size="12">[2] 010110 (22)</text>
    <text x="50" y="210" fill="#A5F3FC" font-family="monospace" font-size="12">[3] 000101 (5)</text>
    <text x="50" y="245" fill="#A5F3FC" font-family="monospace" font-size="12">[4] 101110 (46)</text>
    <text x="130" y="280" fill="#67E8F9" font-family="'Stack Sans Notch', sans-serif" font-size="11" text-anchor="middle">24 Bits / 6 = 4 Chunks</text>

    <rect x="25" y="320" width="210" height="115" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="35" y="345" fill="#E2E8F0" font-family="'Mitr', sans-serif" font-size="13" font-weight="600">• หั่นบิตออกเป็นบล็อกละ 6 บิต</text>
    <text x="35" y="372" fill="#94A3B8" font-family="'Mitr', sans-serif" font-size="12">• ได้ค่าเลขฐานสิบตั้งแต่ 0 ถึง 63</text>
    <text x="35" y="399" fill="#94A3B8" font-family="'Mitr', sans-serif" font-size="12">• ตรงกับความจุ 64 อักขระ</text>
    <text x="35" y="423" fill="#06B6D4" font-family="'Mitr', sans-serif" font-size="11" font-weight="600">[Equal 6-Bit Slices]</text>
  </g>

  <!-- STAGE 3: Base64 Index Table Lookup -->
  <g transform="translate(680, 140)" filter="url(#shadowBox14)">
    <rect width="260" height="460" rx="16" fill="url(#cardGrad14)" stroke="#3B82F6" stroke-width="2"/>
    <circle cx="45" cy="45" r="22" fill="#2563EB"/>
    <text x="45" y="52" fill="#FFFFFF" font-family="'Stack Sans Notch', sans-serif" font-weight="900" font-size="18" text-anchor="middle">3</text>
    <text x="80" y="50" fill="#FFFFFF" font-family="'Mitr', sans-serif" font-weight="700" font-size="16">เทียบตาราง Base64</text>
    <text x="80" y="68" fill="#94A3B8" font-family="'Stack Sans Notch', sans-serif" font-size="12">Index Table Lookup</text>

    <!-- Visual Lookup Mapping -->
    <rect x="30" y="100" width="200" height="200" rx="12" fill="#090D16" stroke="#2563EB" stroke-width="1.5"/>
    <text x="50" y="140" fill="#93C5FD" font-family="monospace" font-size="13">Index 19 --&gt; 'T'</text>
    <text x="50" y="175" fill="#93C5FD" font-family="monospace" font-size="13">Index 22 --&gt; 'W'</text>
    <text x="50" y="210" fill="#93C5FD" font-family="monospace" font-size="13">Index  5 --&gt; 'F'</text>
    <text x="50" y="245" fill="#93C5FD" font-family="monospace" font-size="13">Index 46 --&gt; 'u'</text>
    <text x="130" y="280" fill="#60A5FA" font-family="'Stack Sans Notch', sans-serif" font-size="11" text-anchor="middle">Set: A-Z, a-z, 0-9, +, /</text>

    <rect x="25" y="320" width="210" height="115" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="35" y="345" fill="#E2E8F0" font-family="'Mitr', sans-serif" font-size="13" font-weight="600">• นำตัวเลขเทียบตารางมาตรฐาน</text>
    <text x="35" y="372" fill="#94A3B8" font-family="'Mitr', sans-serif" font-size="12">• สอดคล้องตามมาตรฐาน RFC 4648</text>
    <text x="35" y="399" fill="#94A3B8" font-family="'Mitr', sans-serif" font-size="12">• หากไม่ครบคู่จะเติมเครื่องหมาย '='</text>
    <text x="35" y="423" fill="#60A5FA" font-family="'Mitr', sans-serif" font-size="11" font-weight="600">[Standardized Alphabet Map]</text>
  </g>

  <!-- STAGE 4: Safe ASCII Text Output -->
  <g transform="translate(990, 140)" filter="url(#shadowBox14)">
    <rect width="240" height="460" rx="16" fill="url(#cardGrad14)" stroke="#A855F7" stroke-width="2"/>
    <circle cx="45" cy="45" r="22" fill="#9333EA"/>
    <text x="45" y="52" fill="#FFFFFF" font-family="'Stack Sans Notch', sans-serif" font-weight="900" font-size="18" text-anchor="middle">4</text>
    <text x="80" y="50" fill="#FFFFFF" font-family="'Mitr', sans-serif" font-weight="700" font-size="16">ส่งผ่านเว็บปลอดภัย</text>
    <text x="80" y="68" fill="#94A3B8" font-family="'Stack Sans Notch', sans-serif" font-size="12">Safe ASCII Output</text>

    <!-- Visual Final Output String -->
    <rect x="20" y="100" width="200" height="200" rx="12" fill="#090D16" stroke="#9333EA" stroke-width="1.5"/>
    <rect x="35" y="150" width="170" height="60" rx="8" fill="#581C87" stroke="#C084FC" stroke-width="2"/>
    <text x="120" y="190" fill="#F3E8FF" font-family="'Stack Sans Notch', monospace" font-size="24" font-weight="900" text-anchor="middle">"TWFu"</text>
    <text x="120" y="240" fill="#E9D5FF" font-family="'Mitr', sans-serif" font-size="12" text-anchor="middle">ส่งผ่าน JSON, URL, HTTP</text>
    <text x="120" y="265" fill="#34D399" font-family="'Stack Sans Notch', sans-serif" font-size="11" text-anchor="middle">Zero Data Corruption</text>

    <rect x="15" y="320" width="210" height="115" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="25" y="345" fill="#E2E8F0" font-family="'Mitr', sans-serif" font-size="13" font-weight="600">• ไม่เกิดปัญหาตัวอักษรเพี้ยน</text>
    <text x="25" y="372" fill="#94A3B8" font-family="'Mitr', sans-serif" font-size="12">• ฝังในเว็บและ JSON ได้โดยตรง</text>
    <text x="25" y="399" fill="#94A3B8" font-family="'Mitr', sans-serif" font-size="12">• ขนาดเพิ่มขึ้นประมาณ 33%</text>
    <text x="25" y="423" fill="#C084FC" font-family="'Mitr', sans-serif" font-size="11" font-weight="600">[Safe Web Transport]</text>
  </g>

  <!-- Caption Footer -->
  <rect x="50" y="620" width="1180" height="60" rx="8" fill="#0F172A" stroke="#1E293B"/>
  <text x="70" y="655" fill="#94A3B8" font-family="'Mitr', sans-serif" font-size="14">
    <tspan fill="#34D399" font-weight="700">คำอธิบายกระบวนการ:</tspan> Base64 นำข้อมูล 8 บิตมาหั่นใหม่เป็น 6 บิตเพื่อจับคู่กับตัวอักษรที่พิมพ์ได้ 64 ตัว ทำให้ส่งไฟล์ผ่านช่องทางข้อความของเว็บได้โดยไม่สูญหาย
  </text>
</svg>