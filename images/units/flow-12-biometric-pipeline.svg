<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad12" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadowBox" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Dark Tech Background &amp; Circuit Grid -->
  <rect width="1280" height="720" fill="url(#bgGrad12)"/>
  <g stroke="#1E293B" stroke-width="1" stroke-dasharray="6 6" opacity="0.4">
    <line x1="0" y1="140" x2="1280" y2="140"/>
    <line x1="0" y1="580" x2="1280" y2="580"/>
    <line x1="330" y1="0" x2="330" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="950" y1="0" x2="950" y2="720"/>
  </g>

  <!-- Header Title Banner -->
  <rect x="50" y="30" width="1180" height="70" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2" filter="url(#shadowBox)"/>
  <rect x="65" y="45" width="8" height="40" rx="4" fill="#06B6D4"/>
  <text x="85" y="65" fill="#38BDF8" font-family="'Stack Sans Notch', 'Segoe UI', sans-serif" font-weight="900" font-size="14" letter-spacing="3">UNIT 12 • BIOMETRIC TEMPLATE PIPELINE SIMULATION</text>
  <text x="85" y="87" fill="#F8FAFC" font-family="'Mitr', sans-serif" font-weight="700" font-size="20">วงจรการลงทะเบียนและการจับคู่แม่แบบข้อมูลชีวมิติ 4 ขั้นตอน</text>

  <!-- Connective Directional Arrows -->
  <g stroke="#06B6D4" stroke-width="3" fill="none" opacity="0.8">
    <path d="M 320 370 L 370 370" marker-end="url(#arrow)" stroke-dasharray="8 4"/>
    <path d="M 630 370 L 680 370" marker-end="url(#arrow)" stroke-dasharray="8 4"/>
    <path d="M 940 370 L 990 370" marker-end="url(#arrow)" stroke-dasharray="8 4"/>
  </g>

  <!-- STAGE 1: Sensor Capture -->
  <g transform="translate(60, 140)" filter="url(#shadowBox)">
    <rect width="260" height="460" rx="16" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="45" cy="45" r="22" fill="#0284C7"/>
    <text x="45" y="52" fill="#FFFFFF" font-family="'Stack Sans Notch', sans-serif" font-weight="900" font-size="18" text-anchor="middle">1</text>
    <text x="80" y="50" fill="#FFFFFF" font-family="'Mitr', sans-serif" font-weight="700" font-size="16">ตรวจจับข้อมูลกายภาพ</text>
    <text x="80" y="68" fill="#94A3B8" font-family="'Stack Sans Notch', sans-serif" font-size="12">Sensor Capture</text>
    
    <!-- Illustration: Fingerprint Platen &amp; Laser Scanner -->
    <rect x="30" y="100" width="200" height="200" rx="12" fill="#090D16" stroke="#0284C7" stroke-width="1.5"/>
    <!-- Fingerprint ridges -->
    <path d="M 130 140 A 30 30 0 0 1 130 200 M 130 130 A 40 40 0 0 1 130 210 M 130 120 A 50 50 0 0 1 130 220 M 130 150 A 20 20 0 0 1 130 190" stroke="#06B6D4" stroke-width="3" fill="none" stroke-linecap="round"/>
    <line x1="40" y1="170" x2="220" y2="170" stroke="#38BDF8" stroke-width="2" opacity="0.8" filter="url(#glowCyan)"/>
    
    <rect x="25" y="320" width="210" height="115" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="35" y="345" fill="#E2E8F0" font-family="'Mitr', sans-serif" font-size="13" font-weight="600">• สแกนเนอร์ออปติคัล/คาปาซิทีฟ</text>
    <text x="35" y="372" fill="#94A3B8" font-family="'Mitr', sans-serif" font-size="12">• จับภาพรอยลายนิ้วมือหรือใบหน้า</text>
    <text x="35" y="399" fill="#94A3B8" font-family="'Mitr', sans-serif" font-size="12">• ได้ข้อมูลดิบเป็นสัญญาณอนาล็อก</text>
    <text x="35" y="423" fill="#38BDF8" font-family="'Mitr', sans-serif" font-size="11" font-weight="600">[Raw Biometric Signal]</text>
  </g>

  <!-- STAGE 2: Minutiae Feature Extraction -->
  <g transform="translate(370, 140)" filter="url(#shadowBox)">
    <rect width="260" height="460" rx="16" fill="url(#cardGrad)" stroke="#06B6D4" stroke-width="2"/>
    <circle cx="45" cy="45" r="22" fill="#0D9488"/>
    <text x="45" y="52" fill="#FFFFFF" font-family="'Stack Sans Notch', sans-serif" font-weight="900" font-size="18" text-anchor="middle">2</text>
    <text x="80" y="50" fill="#FFFFFF" font-family="'Mitr', sans-serif" font-weight="700" font-size="16">สกัดจุดลักษณะเด่น</text>
    <text x="80" y="68" fill="#94A3B8" font-family="'Stack Sans Notch', sans-serif" font-size="12">Minutiae Extraction</text>

    <!-- Illustration: Extracted coordinate points and ridge bifurcations -->
    <rect x="30" y="100" width="200" height="200" rx="12" fill="#090D16" stroke="#0D9488" stroke-width="1.5"/>
    <circle cx="100" cy="150" r="5" fill="#10B981" filter="url(#glowCyan)"/>
    <circle cx="150" cy="170" r="5" fill="#10B981" filter="url(#glowCyan)"/>
    <circle cx="120" cy="210" r="5" fill="#10B981" filter="url(#glowCyan)"/>
    <circle cx="170" cy="240" r="5" fill="#10B981" filter="url(#glowCyan)"/>
    <line x1="100" y1="150" x2="150" y2="170" stroke="#10B981" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="150" y1="170" x2="120" y2="210" stroke="#10B981" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="120" y1="210" x2="170" y2="240" stroke="#10B981" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="130" y="275" fill="#6EE7B7" font-family="'Stack Sans Notch', monospace" font-size="11" text-anchor="middle">Ridge Endings &amp; Bifurcations</text>

    <rect x="25" y="320" width="210" height="115" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="35" y="345" fill="#E2E8F0" font-family="'Mitr', sans-serif" font-size="13" font-weight="600">• ค้นหาจุดปลายเส้นและจุดแยก</text>
    <text x="35" y="372" fill="#94A3B8" font-family="'Mitr', sans-serif" font-size="12">• คำนวณพิกัดมุม (x, y, θ)</text>
    <text x="35" y="399" fill="#94A3B8" font-family="'Mitr', sans-serif" font-size="12">• ตัดภาพถ่ายทิ้งเพื่อความปลอดภัย</text>
    <text x="35" y="423" fill="#10B981" font-family="'Mitr', sans-serif" font-size="11" font-weight="600">[Feature Coordinate Vectors]</text>
  </g>

  <!-- STAGE 3: Mathematical Template Conversion -->
  <g transform="translate(680, 140)" filter="url(#shadowBox)">
    <rect width="260" height="460" rx="16" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="2"/>
    <circle cx="45" cy="45" r="22" fill="#4F46E5"/>
    <text x="45" y="52" fill="#FFFFFF" font-family="'Stack Sans Notch', sans-serif" font-weight="900" font-size="18" text-anchor="middle">3</text>
    <text x="80" y="50" fill="#FFFFFF" font-family="'Mitr', sans-serif" font-weight="700" font-size="16">แปลงเป็นแม่แบบตัวเลข</text>
    <text x="80" y="68" fill="#94A3B8" font-family="'Stack Sans Notch', sans-serif" font-size="12">Mathematical Template</text>

    <!-- Illustration: Encrypted numeric hash matrix -->
    <rect x="30" y="100" width="200" height="200" rx="12" fill="#090D16" stroke="#6366F1" stroke-width="1.5"/>
    <text x="45" y="140" fill="#A5B4FC" font-family="monospace" font-size="12">0x7F2A: 1011 0010</text>
    <text x="45" y="170" fill="#A5B4FC" font-family="monospace" font-size="12">0x7F2B: 1100 1101</text>
    <text x="45" y="200" fill="#A5B4FC" font-family="monospace" font-size="12">0x7F2C: 0010 1010</text>
    <text x="45" y="230" fill="#A5B4FC" font-family="monospace" font-size="12">HASH_SHA256(Minutiae)</text>
    <text x="45" y="260" fill="#38BDF8" font-family="monospace" font-size="11">Non-Reversible Data</text>

    <rect x="25" y="320" width="210" height="115" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="35" y="345" fill="#E2E8F0" font-family="'Mitr', sans-serif" font-size="13" font-weight="600">• แปลงเป็นชุดตัวเลขไบนารี</text>
    <text x="35" y="372" fill="#94A3B8" font-family="'Mitr', sans-serif" font-size="12">• ไม่สามารถย้อนกลับเป็นภาพจริงได้</text>
    <text x="35" y="399" fill="#94A3B8" font-family="'Mitr', sans-serif" font-size="12">• ปลอดภัยและสอดคล้อง PDPA</text>
    <text x="35" y="423" fill="#818CF8" font-family="'Mitr', sans-serif" font-size="11" font-weight="600">[Encrypted Biometric Hash]</text>
  </g>

  <!-- STAGE 4: Template Matching &amp; Decision Threshold -->
  <g transform="translate(990, 140)" filter="url(#shadowBox)">
    <rect width="240" height="460" rx="16" fill="url(#cardGrad)" stroke="#10B981" stroke-width="2"/>
    <circle cx="45" cy="45" r="22" fill="#059669"/>
    <text x="45" y="52" fill="#FFFFFF" font-family="'Stack Sans Notch', sans-serif" font-weight="900" font-size="18" text-anchor="middle">4</text>
    <text x="80" y="50" fill="#FFFFFF" font-family="'Mitr', sans-serif" font-weight="700" font-size="16">ตัดสินผลการจับคู่</text>
    <text x="80" y="68" fill="#94A3B8" font-family="'Stack Sans Notch', sans-serif" font-size="12">Threshold Match</text>

    <!-- Illustration: Shield &amp; Match Score Bar -->
    <rect x="20" y="100" width="200" height="200" rx="12" fill="#090D16" stroke="#10B981" stroke-width="1.5"/>
    <path d="M 120 130 L 160 145 L 160 190 Q 120 220 120 220 Q 80 190 80 190 L 80 145 Z" fill="#065F46" stroke="#34D399" stroke-width="2"/>
    <path d="M 105 170 L 115 180 L 135 155" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Score Bar -->
    <rect x="40" y="240" width="160" height="12" rx="6" fill="#1E293B"/>
    <rect x="40" y="240" width="150" height="12" rx="6" fill="#10B981"/>
    <text x="120" y="275" fill="#34D399" font-family="'Stack Sans Notch', sans-serif" font-weight="700" font-size="14" text-anchor="middle">MATCH: 98.7% &gt; THRESHOLD</text>

    <rect x="15" y="320" width="210" height="115" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="25" y="345" fill="#E2E8F0" font-family="'Mitr', sans-serif" font-size="13" font-weight="600">• นำแม่แบบสดเทียบกับฐานข้อมูล</text>
    <text x="25" y="372" fill="#94A3B8" font-family="'Mitr', sans-serif" font-size="12">• หากคะแนนสูงกว่าเกณฑ์ = ผ่าน</text>
    <text x="25" y="399" fill="#94A3B8" font-family="'Mitr', sans-serif" font-size="12">• ต่ำกว่าเกณฑ์ = ปฏิเสธ (FRR/FAR)</text>
    <text x="25" y="423" fill="#34D399" font-family="'Mitr', sans-serif" font-size="11" font-weight="600">[Access Granted / Denied]</text>
  </g>

  <!-- Bottom Caption Footer -->
  <rect x="50" y="620" width="1180" height="60" rx="8" fill="#0F172A" stroke="#1E293B"/>
  <text x="70" y="655" fill="#94A3B8" font-family="'Mitr', sans-serif" font-size="14">
    <tspan fill="#38BDF8" font-weight="700">คำอธิบายกระบวนการ:</tspan> การสแกนข้อมูลชีวมิติไม่ได้จัดเก็บรูปถ่ายจริง แต่จะสกัดพิกัดจุดเด่น (Minutiae) แล้วเข้ารหัสเป็นแม่แบบทางคณิตศาสตร์ (Template) เพื่อใช้เปรียบเทียบความคล้ายคลึงเท่านั้น
  </text>
</svg>