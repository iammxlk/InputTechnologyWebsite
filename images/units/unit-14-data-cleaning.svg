<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Technical Grid Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4 8" opacity="0.3">
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="640" x2="1280" y2="640"/>
    <line x1="330" y1="0" x2="330" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="950" y1="0" x2="950" y2="720"/>
  </g>


  <rect x="50" y="24" width="1180" height="74" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="80" y="52" font-family="'Stack Sans Notch', sans-serif" font-size="17" font-weight="700" fill="#38BDF8">
    DATA CLEANING &amp; POWER QUERY ETL TRANSFORMATION PIPELINE
  </text>
  <text x="80" y="78" font-family="'Mitr', sans-serif" font-size="13" font-weight="400" fill="#94A3B8">
    ขั้นตอนการสกัด ล้างข้อมูลที่สกปรก และแปลงโครงสร้างสู่มาตรฐานพร้อมวิเคราะห์
  </text>

  <!-- STAGE 1: Dirty Ingestion -->
  <g transform="translate(50, 115)" filter="url(#cardShadow)">
    <rect width="270" height="565" rx="12" fill="#131E36" stroke="#EF4444" stroke-width="1.8"/>
    <rect width="270" height="46" rx="12" fill="#1E293B"/>
    <rect x="14" y="9" width="76" height="28" rx="6" fill="#DC2626"/>
    <text x="52" y="28" font-family="'Stack Sans Notch', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">STAGE 01</text>
    <text x="100" y="29" font-family="'Mitr', sans-serif" font-size="14.5" font-weight="600" fill="#FFFFFF">Raw Dirty Ingest</text>
    <g transform="translate(14, 58)">
      <rect width="242" height="150" rx="8" fill="#0B1324" stroke="#1E293B"/>
      <!-- Corrupted items -->
      <g transform="translate(20, 20)">
        <text x="0" y="20" font-family="'Stack Sans Notch', sans-serif" font-size="12" fill="#EF4444">• "  สมชาย  ใจดี  "</text>
        <text x="0" y="45" font-family="'Stack Sans Notch', sans-serif" font-size="12" fill="#EF4444">• 2026/24/10 [DATE ERROR]</text>
        <text x="0" y="70" font-family="'Stack Sans Notch', sans-serif" font-size="12" fill="#EF4444">• student_id: 6720101001 (ซ้ำ)</text>
        <text x="0" y="95" font-family="'Stack Sans Notch', sans-serif" font-size="12" fill="#EF4444">• score: "N/A" (TYPE MISMATCH)</text>
      </g>
    </g>
    <g transform="translate(16, 230)">
      <text x="0" y="16" font-family="'Mitr', sans-serif" font-size="13.5" font-weight="600" fill="#F87171">ปัญหาในข้อมูลดิบ:</text>
      <text x="0" y="42" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• ช่องว่างหัวท้ายสะเปะสะปะ</text>
      <text x="0" y="68" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• รูปแบบวันที่สลับเดือนวันไม่ตรง</text>
      <text x="0" y="94" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• มีข้อมูลซ้ำซ้อนจากหลายแหล่ง</text>
      <text x="0" y="120" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• นำไปประมวลผลทันทีไม่ได้</text>
      <rect x="0" y="270" width="238" height="36" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="119" y="293" font-family="'Mitr', sans-serif" font-size="12.5" fill="#F87171" text-anchor="middle">สถานะ: ข้อมูลดิบปนเปื้อน</text>
    </g>
  </g>

  <!-- Arrow 1->2 -->
  <g transform="translate(328, 380)"><circle cx="10" cy="0" r="13" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/><path d="M 6 -5 L 14 0 L 6 5" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/></g>

  <!-- STAGE 2: Trim &amp; Standardize -->
  <g transform="translate(350, 115)" filter="url(#cardShadow)">
    <rect width="270" height="565" rx="12" fill="#131E36" stroke="#0284C7" stroke-width="1.8"/>
    <rect width="270" height="46" rx="12" fill="#1E293B"/>
    <rect x="14" y="9" width="76" height="28" rx="6" fill="#0284C7"/>
    <text x="52" y="28" font-family="'Stack Sans Notch', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">STAGE 02</text>
    <text x="100" y="29" font-family="'Mitr', sans-serif" font-size="14.5" font-weight="600" fill="#FFFFFF">Trim &amp; Format</text>
    <g transform="translate(14, 58)">
      <rect width="242" height="150" rx="8" fill="#0B1324" stroke="#1E293B"/>
      <!-- Cleaned strings -->
      <g transform="translate(20, 25)">
        <rect width="202" height="40" rx="4" fill="#1E293B" stroke="#0284C7"/>
        <text x="101" y="24" font-family="'Stack Sans Notch', sans-serif" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">TRIM(full_name)</text>
        <text x="101" y="42" font-family="'Mitr', sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">"สมชาย ใจดี"</text>
        <rect y="50" width="202" height="40" rx="4" fill="#1E293B" stroke="#38BDF8"/>
        <text x="101" y="74" font-family="'Stack Sans Notch', sans-serif" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">DATE FORMAT YYYY-MM-DD</text>
      </g>
    </g>
    <g transform="translate(16, 230)">
      <text x="0" y="16" font-family="'Mitr', sans-serif" font-size="13.5" font-weight="600" fill="#38BDF8">การจัดระเบียบข้อความ:</text>
      <text x="0" y="42" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• ตัด Spacebar หน้าหลังด้วย TRIM</text>
      <text x="0" y="68" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• ปรับตัวอักษรพิมพ์เล็ก-ใหญ่ให้ตรงกัน</text>
      <text x="0" y="94" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• จัดระเบียบฟอร์แมตวันเวลาสากล ISO</text>
      <text x="0" y="120" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• แปลงชนิดข้อมูล Text เป็น Number</text>
      <rect x="0" y="270" width="238" height="36" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="119" y="293" font-family="'Mitr', sans-serif" font-size="12.5" fill="#38BDF8" text-anchor="middle">ฟอร์แมตมาตรฐานเดียวกัน</text>
    </g>
  </g>

  <!-- Arrow 2->3 -->
  <g transform="translate(628, 380)"><circle cx="10" cy="0" r="13" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/><path d="M 6 -5 L 14 0 L 6 5" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/></g>

  <!-- STAGE 3: Deduplication &amp; Outlier Removal -->
  <g transform="translate(650, 115)" filter="url(#cardShadow)">
    <rect width="270" height="565" rx="12" fill="#131E36" stroke="#10B981" stroke-width="1.8"/>
    <rect width="270" height="46" rx="12" fill="#1E293B"/>
    <rect x="14" y="9" width="76" height="28" rx="6" fill="#10B981"/>
    <text x="52" y="28" font-family="'Stack Sans Notch', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">STAGE 03</text>
    <text x="100" y="29" font-family="'Mitr', sans-serif" font-size="14.5" font-weight="600" fill="#FFFFFF">Deduplication</text>
    <g transform="translate(14, 58)">
      <rect width="242" height="150" rx="8" fill="#0B1324" stroke="#1E293B"/>
      <!-- Dedup rows -->
      <g transform="translate(20, 25)">
        <rect width="202" height="45" rx="4" fill="#1E293B" stroke="#10B981"/>
        <text x="101" y="47" font-family="'Stack Sans Notch', sans-serif" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">DISTINCT BY student_id</text>
        <text x="101" y="63" font-family="'Mitr', sans-serif" font-size="10.5" fill="#A7F3D0" text-anchor="middle">ลบแถวซ้ำ 4 แถวออกทันที</text>
      </g>
      <text x="121" y="115" font-family="'Stack Sans Notch', sans-serif" font-size="11" fill="#CBD5E1" text-anchor="middle">Z-SCORE OUTLIER FILTER</text>
    </g>
    <g transform="translate(16, 230)">
      <text x="0" y="16" font-family="'Mitr', sans-serif" font-size="13.5" font-weight="600" fill="#34D399">การกำจัดแถวซ้ำและค่าเพี้ยน:</text>
      <text x="0" y="42" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• คำนวณ Hash ตรวจจับเรคอร์ดซ้ำ</text>
      <text x="0" y="68" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• เลือกรักษาเรคอร์ดล่าสุดที่ถูกต้อง</text>
      <text x="0" y="94" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• กรองค่าผิดปกติ (Outliers) ทางสถิติ</text>
      <text x="0" y="120" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• ป้องกันคะแนนเฉลี่ยเบี่ยงเบน</text>
      <rect x="0" y="270" width="238" height="36" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="119" y="293" font-family="'Mitr', sans-serif" font-size="12.5" fill="#A7F3D0" text-anchor="middle">เหลือเฉพาะแถวที่ไม่ซ้ำกัน</text>
    </g>
  </g>

  <!-- Arrow 3->4 -->
  <g transform="translate(928, 380)"><circle cx="10" cy="0" r="13" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/><path d="M 6 -5 L 14 0 L 6 5" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/></g>

  <!-- STAGE 4: Golden Record -->
  <g transform="translate(950, 115)" filter="url(#cardShadow)">
    <rect width="280" height="565" rx="12" fill="#131E36" stroke="#F59E0B" stroke-width="1.8"/>
    <rect width="280" height="46" rx="12" fill="#1E293B"/>
    <rect x="14" y="9" width="76" height="28" rx="6" fill="#F59E0B"/>
    <text x="52" y="28" font-family="'Stack Sans Notch', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">STAGE 04</text>
    <text x="100" y="29" font-family="'Mitr', sans-serif" font-size="14.5" font-weight="600" fill="#FFFFFF">Golden Record</text>
    <g transform="translate(14, 58)">
      <rect width="252" height="150" rx="8" fill="#0B1324" stroke="#1E293B"/>
      <!-- Clean table icon -->
      <rect x="25" y="25" width="202" height="50" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="126" y="47" font-family="'Stack Sans Notch', sans-serif" font-size="12" font-weight="700" fill="#FBBF24" text-anchor="middle">CLEAN DATA WAREHOUSE</text>
      <text x="126" y="63" font-family="'Stack Sans Notch', sans-serif" font-size="10.5" fill="#34D399" text-anchor="middle">100% QUALITY VALIDATED</text>
      <text x="126" y="115" font-family="'Mitr', sans-serif" font-size="11" fill="#E2E8F0" text-anchor="middle">พร้อมสร้างแดชบอร์ด Power BI</text>
    </g>
    <g transform="translate(16, 230)">
      <text x="0" y="16" font-family="'Mitr', sans-serif" font-size="13.5" font-weight="600" fill="#FBBF24">ชุดข้อมูลสมบูรณ์พร้อมใช้:</text>
      <text x="0" y="42" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• ข้อมูลมีความสอดคล้อง (Consistency)</text>
      <text x="0" y="68" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• นำเข้าคลังข้อมูล Data Warehouse</text>
      <text x="0" y="94" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• นำไปฝึกโมเดล AI / Machine Learning</text>
      <text x="0" y="120" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• สร้างรายงานเชิงบริหารตัดสินใจแม่นยำ</text>
      <rect x="0" y="270" width="248" height="36" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="124" y="293" font-family="'Mitr', sans-serif" font-size="12.5" fill="#FDE68A" text-anchor="middle">ผลลัพธ์ข้อมูลทองคำ (Golden Record)</text>
    </g>
  </g>

</svg>