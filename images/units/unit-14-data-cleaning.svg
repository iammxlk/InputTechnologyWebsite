<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad14" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#080E1E"/>
    </linearGradient>
    <linearGradient id="dirtyHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="cleanHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="pipeGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="shadow14" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Stack Sans Notch', 'Segoe UI Mono', monospace; font-variant-numeric: tabular-nums; }
    .thai { font-family: 'Mitr', 'Segoe UI', system-ui, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad14)"/>

  <!-- Top Title Badge -->
  <g transform="translate(64, 40)">
    <rect width="450" height="34" rx="6" fill="#1E293B" stroke="#334155"/>
    <circle cx="18" cy="17" r="5" fill="#10B981"/>
    <text x="32" y="22" fill="#34D399" font-size="13" font-weight="700" class="mono">AUTOMATED ETL &amp; DATA CLEANING PIPELINE</text>
    <text x="0" y="66" fill="#F8FAFC" font-size="22" font-weight="600" class="thai">กระบวนการทำความสะอาดข้อมูลดิบและการแปลงสภาพสู่ฐานข้อมูล (ETL Workflow)</text>
  </g>

  <!-- ==================== STAGE 1: RAW DIRTY INGESTION ==================== -->
  <g transform="translate(64, 150)" filter="url(#shadow14)">
    <rect width="320" height="490" rx="12" fill="#141C2E" stroke="#334155" stroke-width="1.5"/>
    <!-- Header -->
    <path d="M 0 12 Q 0 0 12 0 L 308 0 Q 320 0 320 12 L 320 54 L 0 54 Z" fill="url(#dirtyHeader)"/>
    <text x="18" y="34" fill="#FFFFFF" font-size="15" font-weight="700" class="mono">1. RAW UNCLEANED DATA</text>
    <rect x="238" y="18" width="64" height="20" rx="4" fill="#7F1D1D"/>
    <text x="246" y="32" fill="#FCA5A5" font-size="10" font-weight="800" class="mono">ANOMALIES</text>

    <!-- Content Blocks: Common Data Dirty Issues -->
    <g transform="translate(18, 72)" class="mono" font-size="11">
      <!-- Issue 1: Null/Missing Value -->
      <g transform="translate(0, 0)">
        <rect width="284" height="68" rx="8" fill="#1E192B" stroke="#EF4444" stroke-width="1.2"/>
        <text x="12" y="22" fill="#F87171" font-weight="700">ERR 01: NULL / MISSING FIELD</text>
        <text x="12" y="40" fill="#94A3B8">ID: "6720101015", Name: <tspan fill="#EF4444" font-weight="700">null</tspan></text>
        <text x="12" y="56" fill="#64748B" class="thai" font-size="10">สาเหตุ: ผู้ใช้งานเว้นว่างช่องชื่อ-นามสกุล</text>
      </g>

      <!-- Issue 2: Inconsistent Date Formats -->
      <g transform="translate(0, 80)">
        <rect width="284" height="68" rx="8" fill="#1E192B" stroke="#F59E0B" stroke-width="1.2"/>
        <text x="12" y="22" fill="#FBBF24" font-weight="700">ERR 02: INCONSISTENT DATE FORMAT</text>
        <text x="12" y="40" fill="#94A3B8">Raw: <tspan fill="#F59E0B">"27/10/69"</tspan> vs <tspan fill="#F59E0B">"2026-10-27"</tspan></text>
        <text x="12" y="56" fill="#64748B" class="thai" font-size="10">สาเหตุ: รูปแบบปี พ.ศ./ค.ศ. สับสน</text>
      </g>

      <!-- Issue 3: Duplicate Primary Keys -->
      <g transform="translate(0, 160)">
        <rect width="284" height="68" rx="8" fill="#1E192B" stroke="#EF4444" stroke-width="1.2"/>
        <text x="12" y="22" fill="#F87171" font-weight="700">ERR 03: DUPLICATE RECORDS</text>
        <text x="12" y="40" fill="#94A3B8">student_id: <tspan fill="#EF4444">"6720101015"</tspan> (Count: 2)</text>
        <text x="12" y="56" fill="#64748B" class="thai" font-size="10">สาเหตุ: กดส่งแบบฟอร์มซ้ำ 2 ครั้ง</text>
      </g>

      <!-- Issue 4: Trailing Whitespaces & Encoding -->
      <g transform="translate(0, 240)">
        <rect width="284" height="68" rx="8" fill="#1E192B" stroke="#F59E0B" stroke-width="1.2"/>
        <text x="12" y="22" fill="#FBBF24" font-weight="700">ERR 04: TRAILING SPACES &amp; MOJIBAKE</text>
        <text x="12" y="40" fill="#94A3B8">Name: <tspan fill="#F59E0B">"  นายสมชาย  \t"</tspan> + <tspan fill="#EF4444">"???"</tspan></text>
        <text x="12" y="56" fill="#64748B" class="thai" font-size="10">สาเหตุ: แป้นพิมพ์เคาะวรรคเกิน + ฟอนต์เพี้ยน</text>
      </g>

      <!-- Status Summary -->
      <g transform="translate(0, 320)">
        <rect width="284" height="74" rx="8" fill="#0F172A" stroke="#334155"/>
        <text x="12" y="24" fill="#94A3B8" font-size="11">INSPECTION SUMMARY:</text>
        <text x="12" y="44" fill="#EF4444" font-weight="700" font-size="13">HEALTH SCORE: 54% (REJECTED)</text>
        <text x="12" y="62" fill="#64748B" class="thai" font-size="10">ต้องผ่านกระบวนการ Data Cleaning ก่อนเข้า DB</text>
      </g>
    </g>
  </g>

  <!-- ==================== STAGE 2: ETL TRANSFORMATION ENGINE ==================== -->
  <g transform="translate(424, 150)" filter="url(#shadow14)">
    <rect width="432" height="490" rx="12" fill="#111B30" stroke="#0284C7" stroke-width="1.5"/>
    <rect x="0" y="0" width="432" height="54" rx="12" fill="#0C4A6E"/>
    <text x="20" y="34" fill="#E0F2FE" font-size="15" font-weight="700" class="mono">2. AUTOMATED CLEANING ENGINE (POWER QUERY)</text>

    <!-- Pipeline Steps inside the Engine -->
    <g transform="translate(20, 72)" class="mono" font-size="12">
      <!-- Step A -->
      <g transform="translate(0, 0)">
        <rect width="392" height="72" rx="8" fill="#0B1329" stroke="#1E3A5F"/>
        <circle cx="24" cy="24" r="10" fill="#0284C7"/>
        <text x="21" y="28" fill="#FFFFFF" font-size="11" font-weight="800">1</text>
        <text x="44" y="24" fill="#38BDF8" font-weight="700">DEDUPLICATION &amp; INTEGRITY</text>
        <text x="44" y="42" fill="#E2E8F0" class="thai" font-size="11">กรองแถวซ้ำด้วย Primary Key: DISTINCT(student_id)</text>
        <text x="44" y="58" fill="#10B981" font-size="10">[✓ 1 duplicate record removed]</text>
      </g>

      <!-- Step B -->
      <g transform="translate(0, 84)">
        <rect width="392" height="72" rx="8" fill="#0B1329" stroke="#1E3A5F"/>
        <circle cx="24" cy="24" r="10" fill="#0284C7"/>
        <text x="20" y="28" fill="#FFFFFF" font-size="11" font-weight="800">2</text>
        <text x="44" y="24" fill="#38BDF8" font-weight="700">WHITESPACE STRIPPING &amp; UTF-8</text>
        <text x="44" y="42" fill="#E2E8F0" class="thai" font-size="11">ตัดช่องว่างหัวท้าย: TRIM(clean_name), บังคับ UTF-8</text>
        <text x="44" y="58" fill="#10B981" font-size="10">[✓ Extra spaces pruned, mojibake decoded]</text>
      </g>

      <!-- Step C -->
      <g transform="translate(0, 168)">
        <rect width="392" height="72" rx="8" fill="#0B1329" stroke="#1E3A5F"/>
        <circle cx="24" cy="24" r="10" fill="#0284C7"/>
        <text x="20" y="28" fill="#FFFFFF" font-size="11" font-weight="800">3</text>
        <text x="44" y="24" fill="#38BDF8" font-weight="700">STANDARDIZE DATE (ISO 8601)</text>
        <text x="44" y="42" fill="#E2E8F0" class="thai" font-size="11">แปลงทุกฟอร์แมตเป็น YYYY-MM-DD สากล</text>
        <text x="44" y="58" fill="#10B981" font-size="10">[✓ 27/10/2569 → "2026-10-27" converted]</text>
      </g>

      <!-- Step D -->
      <g transform="translate(0, 252)">
        <rect width="392" height="72" rx="8" fill="#0B1329" stroke="#1E3A5F"/>
        <circle cx="24" cy="24" r="10" fill="#0284C7"/>
        <text x="20" y="28" fill="#FFFFFF" font-size="11" font-weight="800">4</text>
        <text x="44" y="24" fill="#38BDF8" font-weight="700">NULL IMPUTATION &amp; VALIDATION</text>
        <text x="44" y="42" fill="#E2E8F0" class="thai" font-size="11">เติมค่าดีฟอลต์ หรือส่งเข้าคิวทวนสอบข้อมูลตกหล่น</text>
        <text x="44" y="58" fill="#10B981" font-size="10">[✓ Regex check passed: Modulo-10 verified]</text>
      </g>

      <!-- Pipeline Execution Metric -->
      <g transform="translate(0, 336)">
        <rect width="392" height="58" rx="8" fill="#042F2E" stroke="#10B981" stroke-width="1.2"/>
        <text x="14" y="22" fill="#34D399" font-weight="700">EXECUTION TIME: 14.8 ms</text>
        <text x="14" y="42" fill="#E2E8F0" class="thai" font-size="11">อัตราความถูกต้องหลังประมวลผล: 100% Zero-Loss Pipeline</text>
      </g>
    </g>
  </g>

  <!-- ==================== STAGE 3: CLEAN PRODUCTION DATA ==================== -->
  <g transform="translate(896, 150)" filter="url(#shadow14)">
    <rect width="320" height="490" rx="12" fill="#141C2E" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 12 Q 0 0 12 0 L 308 0 Q 320 0 320 12 L 320 54 L 0 54 Z" fill="url(#cleanHeader)"/>
    <text x="18" y="34" fill="#FFFFFF" font-size="15" font-weight="700" class="mono">3. CLEAN ENTERPRISE SCHEMA</text>
    <rect x="238" y="18" width="64" height="20" rx="4" fill="#065F46"/>
    <text x="248" y="32" fill="#A7F3D0" font-size="10" font-weight="800" class="mono">READY DB</text>

    <!-- Clean Records Output Table -->
    <g transform="translate(18, 72)" class="mono" font-size="11">
      <rect width="284" height="324" rx="8" fill="#0B1329" stroke="#1E293B"/>

      <!-- Table Header -->
      <rect width="284" height="30" rx="8" fill="#1E293B"/>
      <text x="10" y="20" fill="#94A3B8" font-size="10" font-weight="700">ID</text>
      <text x="90" y="20" fill="#94A3B8" font-size="10" font-weight="700">NAME</text>
      <text x="200" y="20" fill="#94A3B8" font-size="10" font-weight="700">STATUS / DATE</text>

      <!-- Row 1 -->
      <g transform="translate(10, 52)">
        <text x="0" y="0" fill="#38BDF8">6720101015</text>
        <text x="80" y="0" fill="#F8FAFC" class="thai">สมคิด มั่นคง</text>
        <text x="190" y="0" fill="#34D399">2026-10-27</text>
      </g>
      <line x1="8" y1="64" x2="276" y2="64" stroke="#1E293B"/>

      <!-- Row 2 -->
      <g transform="translate(10, 84)">
        <text x="0" y="0" fill="#38BDF8">6720101016</text>
        <text x="80" y="0" fill="#F8FAFC" class="thai">อนันต์ วงศ์ดี</text>
        <text x="190" y="0" fill="#34D399">2026-10-27</text>
      </g>
      <line x1="8" y1="96" x2="276" y2="96" stroke="#1E293B"/>

      <!-- Row 3 -->
      <g transform="translate(10, 116)">
        <text x="0" y="0" fill="#38BDF8">6720101017</text>
        <text x="80" y="0" fill="#F8FAFC" class="thai">วิภาวดี มีสุข</text>
        <text x="190" y="0" fill="#34D399">2026-10-27</text>
      </g>
      <line x1="8" y1="128" x2="276" y2="128" stroke="#1E293B"/>

      <!-- Row 4 -->
      <g transform="translate(10, 148)">
        <text x="0" y="0" fill="#38BDF8">6720101018</text>
        <text x="80" y="0" fill="#F8FAFC" class="thai">ธนพล สุขใจ</text>
        <text x="190" y="0" fill="#34D399">2026-10-27</text>
      </g>
      <line x1="8" y1="160" x2="276" y2="160" stroke="#1E293B"/>

      <!-- Row 5 -->
      <g transform="translate(10, 180)">
        <text x="0" y="0" fill="#38BDF8">6720101019</text>
        <text x="80" y="0" fill="#F8FAFC" class="thai">กัญญา บุญมี</text>
        <text x="190" y="0" fill="#34D399">2026-10-27</text>
      </g>

      <!-- Integrity Badge -->
      <g transform="translate(0, 220)">
        <rect width="284" height="60" rx="6" fill="#042F2E" stroke="#10B981" stroke-width="1.2"/>
        <circle cx="20" cy="30" r="10" fill="#10B981"/>
        <path d="M 16 30 L 19 33 L 25 27" stroke="#FFFFFF" stroke-width="2" fill="none"/>
        <text x="36" y="26" fill="#34D399" font-weight="700">VERIFIED CLEAN</text>
        <text x="36" y="44" fill="#A7F3D0" class="thai" font-size="10">พร้อมนำเข้าคลังข้อมูล Data Warehouse</text>
      </g>
    </g>

    <!-- Destination Cloud Target -->
    <g transform="translate(18, 412)">
      <rect width="284" height="52" rx="8" fill="#1E293B" stroke="#38BDF8"/>
      <text x="12" y="20" fill="#38BDF8" font-size="11" class="mono">DESTINATION: CLOUD SQL / BIGQUERY</text>
      <text x="12" y="38" fill="#E2E8F0" class="thai" font-size="10">รองรับการวิเคราะห์ผลและการออกรายงานอัตโนมัติ</text>
    </g>
  </g>

  <!-- Flow Connector Arrows -->
  <g stroke="url(#pipeGlow)" stroke-width="3" fill="none">
    <path d="M 384 395 L 424 395" marker-end="url(#arrow)"/>
    <path d="M 856 395 L 896 395" marker-end="url(#arrow)"/>
  </g>
</svg>
