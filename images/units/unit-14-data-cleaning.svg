<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad14" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EBF4FE"/>
      <stop offset="100%" stop-color="#D0E3F9"/>
    </linearGradient>
    <filter id="shadow14" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F2B5C" flood-opacity="0.18"/>
    </filter>
    <filter id="glow14">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad14)"/>

  <g transform="translate(640, 410)" filter="url(#shadow14)">
    <!-- Island Platform Base -->
    <path d="M 0 100 L 420 -110 L 420 -60 L 0 150 L -420 -60 L -420 -110 Z" fill="#64748B"/>
    <path d="M 0 150 L 420 -60 L 420 -20 L 0 190 L -420 -20 L -420 -60 Z" fill="#475569"/>
    <path d="M 0 -220 L 420 -10 L 0 200 L -420 -10 Z" fill="#F8FAFC"/>
    <path d="M 0 -220 L -420 -10 L 0 200 Z" fill="#E2E8F0"/>

    <!-- Upper Conveyor: Raw Uncleaned Data Blocks Entering (Cracked & Mixed) -->
    <g transform="translate(-240, -110)">
      <!-- Conveyor Track -->
      <polygon points="0,-16 120,-76 120,-56 0,4" fill="#334155"/>
      <polygon points="0,-16 -40,4 -40,24 0,4" fill="#1E293B"/>

      <!-- Dirty / Corrupted Voxel Block -->
      <g transform="translate(40, -44)">
        <polygon points="0,-20 30,-5 0,10 -30,-5" fill="#78716C"/>
        <polygon points="0,10 30,-5 30,25 0,40" fill="#57534E"/>
        <polygon points="0,10 -30,-5 -30,25 0,40" fill="#44403C"/>
        <!-- Crack Line -->
        <path d="M -8 0 L 0 12 L 8 6 L 14 24" stroke="#DC2626" stroke-width="2.5" fill="none"/>
      </g>
    </g>

    <!-- Central Voxel Filtration Hopper & Wash Sieve Chamber -->
    <g transform="translate(0, -60)">
      <!-- Glass Hopper Walls -->
      <polygon points="-90,-110 90,-110 50,0 -50,0" fill="#38BDF8" opacity="0.45"/>
      <polygon points="90,-110 110,-100 65,10 50,0" fill="#0284C7" opacity="0.6"/>
      <polygon points="-90,-110 -50,0 -65,10 -110,-100" fill="#0369A1" opacity="0.6"/>

      <!-- Internal Cleansing Energy Stream -->
      <g filter="url(#glow14)">
        <ellipse cx="0" cy="-50" rx="35" ry="12" fill="#00E5FF" opacity="0.8"/>
        <line x1="0" y1="-80" x2="0" y2="20" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="6 4"/>
      </g>

      <!-- Hopper Metal Spout -->
      <polygon points="-25,0 25,0 18,36 -18,36" fill="#1E293B"/>
    </g>

    <!-- Lower Conveyor: Pure, Sparkling, Uniform Clean Voxel Data Blocks Emerging -->
    <g transform="translate(180, 50)">
      <!-- Conveyor Track -->
      <polygon points="-80,-40 60,30 60,50 -80,-20" fill="#475569"/>
      <polygon points="60,30 80,20 80,40 60,50" fill="#1E293B"/>

      <!-- Clean Quartz / Diamond Data Blocks -->
      <g transform="translate(-10, -10)" filter="url(#glow14)">
        <polygon points="0,-22 28,-8 0,6 -28,-8" fill="#E0F2FE"/>
        <polygon points="0,6 28,-8 28,20 0,34" fill="#38BDF8"/>
        <polygon points="0,6 -28,-8 -28,20 0,34" fill="#0284C7"/>
      </g>
      <g transform="translate(45, 18)" filter="url(#glow14)">
        <polygon points="0,-22 28,-8 0,6 -28,-8" fill="#F0F9FF"/>
        <polygon points="0,6 28,-8 28,20 0,34" fill="#60A5FA"/>
        <polygon points="0,6 -28,-8 -28,20 0,34" fill="#2563EB"/>
      </g>
    </g>

    <!-- Side Discard Chute (Discarding Null / Duplicate Junk into Recycle Bin) -->
    <g transform="translate(-80, 80)">
      <polygon points="-30,-15 10,-35 25,-10 -15,10" fill="#991B1B"/>
      <polygon points="-30,-15 -15,10 -15,40 -30,15" fill="#7F1D1D"/>
      <polygon points="25,-10 -15,10 -15,40 25,20" fill="#B91C1C"/>
      <!-- Discarded Red Voxel Rubble -->
      <polygon points="-5,2 10,-5 8,12 -7,18" fill="#F87171"/>
    </g>
  </g>
</svg>
