<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Technical Grid Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4 8" opacity="0.3">
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="640" x2="1280" y2="640"/>
    <line x1="330" y1="0" x2="330" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="950" y1="0" x2="950" y2="720"/>
  </g>


  <rect x="50" y="24" width="1180" height="74" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="80" y="52" font-family="'Stack Sans Notch', sans-serif" font-size="17" font-weight="700" fill="#38BDF8">
    HARDWARE SCANNER COMPARISON: 1D LASER VS 2D AREA IMAGER
  </text>
  <text x="80" y="78" font-family="'Mitr', sans-serif" font-size="13" font-weight="400" fill="#94A3B8">
    เปรียบเทียบสถาปัตยกรรมหัวอ่านเลเซอร์เส้นเดียวและหัวอ่านกล้องเซนเซอร์สองมิติ
  </text>

  <!-- COLUMN 1: 1D Oscillating Laser -->
  <g transform="translate(60, 115)" filter="url(#cardShadow)">
    <rect width="560" height="565" rx="14" fill="#131E36" stroke="#2563EB" stroke-width="2"/>
    <rect width="560" height="52" rx="14" fill="#1E293B"/>
    <rect x="18" y="11" width="140" height="30" rx="6" fill="#2563EB"/>
    <text x="88" y="31" font-family="'Stack Sans Notch', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1D LASER SCANNER</text>
    <text x="175" y="32" font-family="'Mitr', sans-serif" font-size="15.5" font-weight="600" fill="#FFFFFF">หัวอ่านเลเซอร์ลำแสงเส้นเดียว</text>

    <!-- Graphic Schematics -->
    <g transform="translate(20, 68)">
      <rect width="520" height="175" rx="8" fill="#0B1324" stroke="#1E293B"/>
      <!-- Laser Hardware Parts -->
      <rect x="30" y="30" width="100" height="40" rx="4" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
      <text x="80" y="55" font-family="'Stack Sans Notch', sans-serif" font-size="11.5" font-weight="700" fill="#EF4444" text-anchor="middle">LASER DIODE</text>
      <!-- Oscillating Mirror -->
      <polygon points="175,25 205,45 195,75 165,55" fill="#38BDF8"/>
      <text x="185" y="95" font-family="'Stack Sans Notch', sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">OSCILLATING MIRROR</text>
      <!-- Single red line -->
      <line x1="205" y1="45" x2="480" y2="45" stroke="#EF4444" stroke-width="3"/>
      <text x="350" y="35" font-family="'Stack Sans Notch', sans-serif" font-size="11" fill="#EF4444">SINGLE OSCILLATING LINE</text>
      <!-- Target Barcode -->
      <rect x="440" y="20" width="60" height="50" fill="#FFFFFF"/>
      <g fill="#000000">
        <rect x="445" y="25" width="3" height="40"/><rect x="452" y="25" width="2" height="40"/>
        <rect x="458" y="25" width="4" height="40"/><rect x="466" y="25" width="2" height="40"/>
        <rect x="474" y="25" width="5" height="40"/><rect x="484" y="25" width="2" height="40"/>
        <rect x="490" y="25" width="4" height="40"/>
      </g>
      <text x="260" y="150" font-family="'Mitr', sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">ข้อจำกัด: อ่านได้เฉพาะ 1D Barcode และต้องทาบให้ตรงแนวเส้น</text>
    </g>

    <!-- Technical Specs -->
    <g transform="translate(25, 265)">
      <text x="0" y="20" font-family="'Mitr', sans-serif" font-size="14.5" font-weight="600" fill="#38BDF8">สเปกและพฤติกรรมการทำงาน:</text>
      <text x="0" y="50" font-family="'Mitr', sans-serif" font-size="13" fill="#CBD5E1">• แหล่งกำเนิดแสง: เลเซอร์ไดโอดความยาวคลื่น 650 นาโนเมตร</text>
      <text x="0" y="76" font-family="'Mitr', sans-serif" font-size="13" fill="#CBD5E1">• กระจกแกว่งมอเตอร์สั่นสะท้อนให้เกิดเส้นแดง 1 เส้น</text>
      <text x="0" y="102" font-family="'Mitr', sans-serif" font-size="13" fill="#CBD5E1">• ต้องหันบาร์โค้ดให้ระนาบตรงกับเส้นแสงเลเซอร์เท่านั้น</text>
      <text x="0" y="128" font-family="'Mitr', sans-serif" font-size="13" fill="#CBD5E1">• ไม่สามารถอ่านข้อมูลจากหน้าจอมือถือได้ (กระจกจอสะท้อนแสงหลอกตา)</text>
      <text x="0" y="154" font-family="'Mitr', sans-serif" font-size="13" fill="#CBD5E1">• ต้นทุนต่ำ นิยมในจุดชำระเงินเคาน์เตอร์แคชเชียร์แบบดั้งเดิม</text>
      <rect x="0" y="195" width="510" height="44" rx="8" fill="#1E293B" stroke="#334155"/>
      <text x="255" y="223" font-family="'Mitr', sans-serif" font-size="13.5" font-weight="500" fill="#93C5FD" text-anchor="middle">รูปแบบข้อมูล: 1D Linear (EAN-13, Code 128, UPC)</text>
    </g>
  </g>

  <!-- COLUMN 2: 2D Area Imager -->
  <g transform="translate(660, 115)" filter="url(#cardShadow)">
    <rect width="560" height="565" rx="14" fill="#131E36" stroke="#10B981" stroke-width="2"/>
    <rect width="560" height="52" rx="14" fill="#1E293B"/>
    <rect x="18" y="11" width="160" height="30" rx="6" fill="#10B981"/>
    <text x="98" y="31" font-family="'Stack Sans Notch', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2D AREA IMAGER</text>
    <text x="195" y="32" font-family="'Mitr', sans-serif" font-size="15.5" font-weight="600" fill="#FFFFFF">หัวอ่านกล้องเซนเซอร์พื้นที่สองมิติ</text>

    <!-- Graphic Schematics -->
    <g transform="translate(20, 68)">
      <rect width="520" height="175" rx="8" fill="#0B1324" stroke="#1E293B"/>
      <!-- LED Illuminator &amp; Camera Array -->
      <rect x="30" y="20" width="80" height="70" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
      <circle cx="70" cy="55" r="18" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
      <circle cx="70" cy="55" r="8" fill="#10B981"/>
      <text x="70" y="105" font-family="'Stack Sans Notch', sans-serif" font-size="10.5" fill="#34D399" text-anchor="middle">CMOS SENSOR</text>
      <!-- Wide Field of View Cone -->
      <polygon points="100,55 450,15 450,115" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-dasharray="3 3"/>
      <!-- QR Target inside FOV -->
      <g transform="translate(420, 35)">
        <rect width="50" height="50" fill="#FFFFFF" rx="4"/>
        <rect x="5" y="5" width="16" height="16" fill="#000000"/>
        <rect x="29" y="5" width="16" height="16" fill="#000000"/>
        <rect x="5" y="29" width="16" height="16" fill="#000000"/>
        <rect x="18" y="18" width="14" height="14" fill="#000000"/>
      </g>
      <text x="260" y="150" font-family="'Mitr', sans-serif" font-size="12" fill="#34D399" text-anchor="middle">จุดเด่น: สแกนได้ 360 องศา ทั้งกระดาษ จอมือถือ และรหัส 1D/2D ทุกชนิด</text>
    </g>

    <!-- Technical Specs -->
    <g transform="translate(25, 265)">
      <text x="0" y="20" font-family="'Mitr', sans-serif" font-size="14.5" font-weight="600" fill="#34D399">สเปกและพฤติกรรมการทำงาน:</text>
      <text x="0" y="50" font-family="'Mitr', sans-serif" font-size="13" fill="#CBD5E1">• แหล่งกำเนิดแสง: ไฟ LED Floodlight พร้อมกรวยเลนส์กว้าง</text>
      <text x="0" y="76" font-family="'Mitr', sans-serif" font-size="13" fill="#CBD5E1">• เซนเซอร์ CMOS Camera บันทึกภาพแบบพื้นที่ (Omnidirectional)</text>
      <text x="0" y="102" font-family="'Mitr', sans-serif" font-size="13" fill="#CBD5E1">• ไม่จำเป็นต้องทาบตรงแนว เอียงหรือกลับหัวก็อ่านได้ทันที</text>
      <text x="0" y="128" font-family="'Mitr', sans-serif" font-size="13" fill="#CBD5E1">• อ่านได้ทั้งบนหน้าจอสมาร์ตโฟน แท็บเล็ต และแผ่นฟิล์มสะท้อน</text>
      <text x="0" y="154" font-family="'Mitr', sans-serif" font-size="13" fill="#CBD5E1">• รองรับทั้ง 1D Barcode, 2D QR Code, Data Matrix, PDF417</text>
      <rect x="0" y="195" width="510" height="44" rx="8" fill="#1E293B" stroke="#334155"/>
      <text x="255" y="223" font-family="'Mitr', sans-serif" font-size="13.5" font-weight="500" fill="#A7F3D0" text-anchor="middle">รูปแบบข้อมูล: 1D + 2D Matrix (QR, Data Matrix, Aztec, PDF417)</text>
    </g>
  </g>

</svg>