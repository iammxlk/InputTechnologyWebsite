<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad15" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cardGrad15" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadowBox15" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad15)"/>
  <g stroke="#1E293B" stroke-width="1" stroke-dasharray="6 6" opacity="0.4">
    <line x1="0" y1="140" x2="1280" y2="140"/>
    <line x1="0" y1="580" x2="1280" y2="580"/>
    <line x1="330" y1="0" x2="330" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="950" y1="0" x2="950" y2="720"/>
  </g>

  <!-- Header Banner -->
  <rect x="50" y="30" width="1180" height="70" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2" filter="url(#shadowBox15)"/>
  <rect x="65" y="45" width="8" height="40" rx="4" fill="#EAB308"/>
  <text x="85" y="65" fill="#FACC15" font-family="'Stack Sans Notch', sans-serif" font-weight="900" font-size="14" letter-spacing="3">UNIT 15 • LOSSLESS ZIP COMPRESSION PIPELINE SIMULATION</text>
  <text x="85" y="87" fill="#F8FAFC" font-family="'Mitr', sans-serif" font-weight="700" font-size="20">ขั้นตอนการบีบอัดข้อมูลแบบไม่สูญเสีย (DEFLATE) และการแตกไฟล์ ZIP</text>

  <!-- Connectors -->
  <g stroke="#EAB308" stroke-width="3" fill="none" opacity="0.8">
    <path d="M 320 370 L 370 370" stroke-dasharray="8 4"/>
    <path d="M 630 370 L 680 370" stroke-dasharray="8 4"/>
    <path d="M 940 370 L 990 370" stroke-dasharray="8 4"/>
  </g>

  <!-- STAGE 1: Source Files Collection -->
  <g transform="translate(60, 140)" filter="url(#shadowBox15)">
    <rect width="260" height="460" rx="16" fill="url(#cardGrad15)" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="45" cy="45" r="22" fill="#0284C7"/>
    <text x="45" y="52" fill="#FFFFFF" font-family="'Stack Sans Notch', sans-serif" font-weight="900" font-size="18" text-anchor="middle">1</text>
    <text x="80" y="50" fill="#FFFFFF" font-family="'Mitr', sans-serif" font-weight="700" font-size="16">รวบรวมไฟล์ต้นทาง</text>
    <text x="80" y="68" fill="#94A3B8" font-family="'Stack Sans Notch', sans-serif" font-size="12">Source Collection</text>

    <!-- Visual 3 Uncompressed Files -->
    <rect x="30" y="100" width="200" height="200" rx="12" fill="#090D16" stroke="#0284C7" stroke-width="1.5"/>
    <rect x="50" y="125" width="160" height="35" rx="6" fill="#1E293B" stroke="#38BDF8"/>
    <text x="65" y="148" fill="#F1F5F9" font-family="'Stack Sans Notch', sans-serif" font-size="12">report.docx (5 MB)</text>
    <rect x="50" y="170" width="160" height="35" rx="6" fill="#1E293B" stroke="#38BDF8"/>
    <text x="65" y="193" fill="#F1F5F9" font-family="'Stack Sans Notch', sans-serif" font-size="12">data.csv (3 MB)</text>
    <rect x="50" y="215" width="160" height="35" rx="6" fill="#1E293B" stroke="#38BDF8"/>
    <text x="65" y="238" fill="#F1F5F9" font-family="'Stack Sans Notch', sans-serif" font-size="12">notes.txt (2 MB)</text>
    <text x="130" y="280" fill="#38BDF8" font-family="'Stack Sans Notch', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Total: 10.0 MB</text>

    <rect x="25" y="320" width="210" height="115" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="35" y="345" fill="#E2E8F0" font-family="'Mitr', sans-serif" font-size="13" font-weight="600">• รวมไฟล์เอกสารที่ต้องการส่ง</text>
    <text x="35" y="372" fill="#94A3B8" font-family="'Mitr', sans-serif" font-size="12">• ยังไม่ผ่านการบีบอัดขนาด</text>
    <text x="35" y="399" fill="#94A3B8" font-family="'Mitr', sans-serif" font-size="12">• ใช้พื้นที่จัดเก็บเต็มจำนวน</text>
    <text x="35" y="423" fill="#38BDF8" font-family="'Mitr', sans-serif" font-size="11" font-weight="600">[Raw Multiple Files]</text>
  </g>

  <!-- STAGE 2: DEFLATE Engine -->
  <g transform="translate(370, 140)" filter="url(#shadowBox15)">
    <rect width="260" height="460" rx="16" fill="url(#cardGrad15)" stroke="#EAB308" stroke-width="2"/>
    <circle cx="45" cy="45" r="22" fill="#CA8A04"/>
    <text x="45" y="52" fill="#FFFFFF" font-family="'Stack Sans Notch', sans-serif" font-weight="900" font-size="18" text-anchor="middle">2</text>
    <text x="80" y="50" fill="#FFFFFF" font-family="'Mitr', sans-serif" font-weight="700" font-size="16">อัลกอริทึม DEFLATE</text>
    <text x="80" y="68" fill="#94A3B8" font-family="'Stack Sans Notch', sans-serif" font-size="12">LZ77 + Huffman Coding</text>

    <!-- Visual Compression Engine -->
    <rect x="30" y="100" width="200" height="200" rx="12" fill="#090D16" stroke="#CA8A04" stroke-width="1.5"/>
    <polygon points="50,130 210,130 160,210 100,210" fill="#713F12" stroke="#EAB308" stroke-width="2"/>
    <text x="130" y="165" fill="#FEF08A" font-family="'Stack Sans Notch', sans-serif" font-size="12" font-weight="700" text-anchor="middle">PATTERN MATCHING</text>
    <text x="130" y="190" fill="#FEF08A" font-family="'Stack Sans Notch', sans-serif" font-size="11" text-anchor="middle">LZ77 &amp; Huffman Tree</text>
    <rect x="80" y="225" width="100" height="35" rx="4" fill="#1E293B" stroke="#EAB308"/>
    <text x="130" y="248" fill="#FACC15" font-family="'Stack Sans Notch', monospace" font-size="12" text-anchor="middle">High Density</text>

    <rect x="25" y="320" width="210" height="115" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="35" y="345" fill="#E2E8F0" font-family="'Mitr', sans-serif" font-size="13" font-weight="600">• ค้นหาข้อความซ้ำ (LZ77)</text>
    <text x="35" y="372" fill="#94A3B8" font-family="'Mitr', sans-serif" font-size="12">• แทนคำซ้ำด้วยรหัสสั้น (Huffman)</text>
    <text x="35" y="399" fill="#94A3B8" font-family="'Mitr', sans-serif" font-size="12">• ไม่ตัดข้อมูลทิ้งแม้แต่ไบต์เดียว</text>
    <text x="35" y="423" fill="#EAB308" font-family="'Mitr', sans-serif" font-size="11" font-weight="600">[Lossless Compression Engine]</text>
  </g>

  <!-- STAGE 3: Bundled ZIP Archive -->
  <g transform="translate(680, 140)" filter="url(#shadowBox15)">
    <rect width="260" height="460" rx="16" fill="url(#cardGrad15)" stroke="#10B981" stroke-width="2"/>
    <circle cx="45" cy="45" r="22" fill="#059669"/>
    <text x="45" y="52" fill="#FFFFFF" font-family="'Stack Sans Notch', sans-serif" font-weight="900" font-size="18" text-anchor="middle">3</text>
    <text x="80" y="50" fill="#FFFFFF" font-family="'Mitr', sans-serif" font-weight="700" font-size="16">สร้างไฟล์ .ZIP รวม</text>
    <text x="80" y="68" fill="#94A3B8" font-family="'Stack Sans Notch', sans-serif" font-size="12">Bundled ZIP Container</text>

    <!-- Visual Zip Box with Zipper -->
    <rect x="30" y="100" width="200" height="200" rx="12" fill="#090D16" stroke="#059669" stroke-width="1.5"/>
    <rect x="60" y="130" width="140" height="110" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
    <line x1="130" y1="130" x2="130" y2="240" stroke="#FBBF24" stroke-width="4" stroke-dasharray="6 4"/>
    <rect x="120" y="170" width="20" height="25" rx="3" fill="#F59E0B"/>
    <text x="130" y="270" fill="#6EE7B7" font-family="'Stack Sans Notch', sans-serif" font-size="13" font-weight="700" text-anchor="middle">project.zip (3.2 MB)</text>
    <text x="130" y="290" fill="#34D399" font-family="'Stack Sans Notch', sans-serif" font-size="11" text-anchor="middle">SAVED: 68% STORAGE</text>

    <rect x="25" y="320" width="210" height="115" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="35" y="345" fill="#E2E8F0" font-family="'Mitr', sans-serif" font-size="13" font-weight="600">• รวมเหลือไฟล์เดียวส่งง่าย</text>
    <text x="35" y="372" fill="#94A3B8" font-family="'Mitr', sans-serif" font-size="12">• ประหยัดแบนด์วิดท์เครือข่าย</text>
    <text x="35" y="399" fill="#94A3B8" font-family="'Mitr', sans-serif" font-size="12">• มี Checksum ตรวจไฟล์เสีย</text>
    <text x="35" y="423" fill="#10B981" font-family="'Mitr', sans-serif" font-size="11" font-weight="600">[Compact Single Archive]</text>
  </g>

  <!-- STAGE 4: Clean Extraction -->
  <g transform="translate(990, 140)" filter="url(#shadowBox15)">
    <rect width="240" height="460" rx="16" fill="url(#cardGrad15)" stroke="#6366F1" stroke-width="2"/>
    <circle cx="45" cy="45" r="22" fill="#4F46E5"/>
    <text x="45" y="52" fill="#FFFFFF" font-family="'Stack Sans Notch', sans-serif" font-weight="900" font-size="18" text-anchor="middle">4</text>
    <text x="80" y="50" fill="#FFFFFF" font-family="'Mitr', sans-serif" font-weight="700" font-size="16">การแตกไฟล์กลับคืน</text>
    <text x="80" y="68" fill="#94A3B8" font-family="'Stack Sans Notch', sans-serif" font-size="12">Extract All (100%)</text>

    <!-- Visual Extracted Files identical to original -->
    <rect x="20" y="100" width="200" height="200" rx="12" fill="#090D16" stroke="#6366F1" stroke-width="1.5"/>
    <path d="M 120 130 L 160 145 L 160 190 Q 120 220 120 220 Q 80 190 80 190 L 80 145 Z" fill="#312E81" stroke="#818CF8" stroke-width="2"/>
    <text x="120" y="180" fill="#FFFFFF" font-family="'Stack Sans Notch', sans-serif" font-size="18" font-weight="900" text-anchor="middle">100%</text>
    <text x="120" y="250" fill="#C7D2FE" font-family="'Mitr', sans-serif" font-size="12" text-anchor="middle">คืนสภาพข้อมูลครบทุกไบต์</text>
    <text x="120" y="275" fill="#A5B4FC" font-family="'Stack Sans Notch', sans-serif" font-size="11" text-anchor="middle">Zero Bit Loss Integrity</text>

    <rect x="15" y="320" width="210" height="115" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="25" y="345" fill="#E2E8F0" font-family="'Mitr', sans-serif" font-size="13" font-weight="600">• แตกไฟล์ด้วยคลิกขวา Extract</text>
    <text x="25" y="372" fill="#94A3B8" font-family="'Mitr', sans-serif" font-size="12">• เนื้อหาเหมือนต้นฉบับ 100%</text>
    <text x="25" y="399" fill="#94A3B8" font-family="'Mitr', sans-serif" font-size="12">• รักษาโครงสร้างโฟลเดอร์เดิม</text>
    <text x="25" y="423" fill="#818CF8" font-family="'Mitr', sans-serif" font-size="11" font-weight="600">[Bit-for-Bit Restoration]</text>
  </g>

  <!-- Caption Footer -->
  <rect x="50" y="620" width="1180" height="60" rx="8" fill="#0F172A" stroke="#1E293B"/>
  <text x="70" y="655" fill="#94A3B8" font-family="'Mitr', sans-serif" font-size="14">
    <tspan fill="#FACC15" font-weight="700">คำอธิบายกระบวนการ:</tspan> การบีบอัดไฟล์ ZIP ใช้หลักการแบบไม่สูญเสียข้อมูล (Lossless) เพื่อรวบรวมไฟล์และลดพื้นที่จัดเก็บ โดยเมื่อแตกไฟล์ออกจะได้ข้อมูลครบถ้วนสมบูรณ์เหมือนต้นฉบับทุกประการ
  </text>
</svg>