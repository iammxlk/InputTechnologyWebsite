<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad12" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080E1E"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#050914"/>
    </linearGradient>

    <linearGradient id="cardGrad12" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="amberGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <linearGradient id="greenGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="glow12" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow12" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&amp;family=Stack+Sans+Notch:wght@600;700&amp;display=swap');
    .mono { font-family: 'Stack Sans Notch', 'Segoe UI Mono', monospace; }
    .thai { font-family: 'Mitr', 'Segoe UI', system-ui, sans-serif; }
  </style>

  <!-- Deep High-Tech Cyber Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad12)"/>

  <!-- Blueprint Grid Pattern -->
  <g stroke="#38BDF8" stroke-opacity="0.05" stroke-width="1.5">
    <line x1="160" y1="0" x2="160" y2="1080"/><line x1="320" y1="0" x2="320" y2="1080"/>
    <line x1="480" y1="0" x2="480" y2="1080"/><line x1="640" y1="0" x2="640" y2="1080"/>
    <line x1="800" y1="0" x2="800" y2="1080"/><line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1120" y1="0" x2="1120" y2="1080"/><line x1="1280" y1="0" x2="1280" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/><line x1="1600" y1="0" x2="1600" y2="1080"/>
    <line x1="1760" y1="0" x2="1760" y2="1080"/>
    <line x1="0" y1="120" x2="1920" y2="120"/><line x1="0" y1="240" x2="1920" y2="240"/>
    <line x1="0" y1="360" x2="1920" y2="360"/><line x1="0" y1="480" x2="1920" y2="480"/>
    <line x1="0" y1="600" x2="1920" y2="600"/><line x1="0" y1="720" x2="1920" y2="720"/>
    <line x1="0" y1="840" x2="1920" y2="840"/><line x1="0" y1="960" x2="1920" y2="960"/>
  </g>

  <!-- Cyber Header Section -->
  <g transform="translate(960, 90)" text-anchor="middle">
    <!-- Top Pill -->
    <rect x="-300" y="-36" width="600" height="42" rx="21" fill="#0E2342" stroke="#0284C7" stroke-width="1.5"/>
    <text x="0" y="-10" fill="#38BDF8" font-size="16" font-weight="700" class="mono" letter-spacing="2">BIOMETRIC AUTHENTICATION &amp; VERIFICATION PIPELINE</text>
    
    <!-- Main Thai Title -->
    <text x="0" y="55" fill="#F8FAFC" font-size="44" font-weight="700" class="thai">ขั้นตอนการนำเข้าและตรวจสอบข้อมูลชีวมิติ</text>
    <text x="0" y="98" fill="#94A3B8" font-size="20" class="mono">4-Stage Biometric Data Flow: Capture ➔ Feature Extraction ➔ Digital Template ➔ Verification</text>
  </g>

  <!-- Flow Connector Line -->
  <path d="M 450 600 L 1500 600" stroke="#0284C7" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="10 10"/>

  <!-- ==================== STAGE 1: CAPTURE ==================== -->
  <g transform="translate(80, 260)" filter="url(#shadow12)">
    <rect width="390" height="660" rx="20" fill="url(#cardGrad12)" stroke="#38BDF8" stroke-width="2"/>
    <rect width="390" height="74" rx="20" fill="#0C4A6E" fill-opacity="0.7"/>
    <rect x="20" y="18" width="40" height="38" rx="8" fill="#0284C7"/>
    <text x="40" y="44" fill="#FFFFFF" font-size="22" font-weight="800" text-anchor="middle" class="mono">1</text>
    <text x="76" y="38" fill="#FFFFFF" font-size="20" font-weight="700" class="thai">สแกนข้อมูลชีวมิติ</text>
    <text x="76" y="58" fill="#7DD3FC" font-size="13" class="mono">BIOMETRIC CAPTURE</text>

    <!-- Visual: Fingerprint & Face Mesh Illustration -->
    <g transform="translate(45, 110)">
      <rect width="300" height="250" rx="14" fill="#08101E" stroke="#1E3A5F" stroke-width="1.5"/>
      
      <!-- Fingerprint Ridge Rings -->
      <g stroke="#38BDF8" stroke-width="2.5" fill="none" opacity="0.85">
        <path d="M 90 200 C 90 150, 110 120, 150 120 C 190 120, 210 150, 210 200"/>
        <path d="M 105 210 C 105 165, 120 140, 150 140 C 180 140, 195 165, 195 210"/>
        <path d="M 120 220 C 120 180, 132 160, 150 160 C 168 160, 180 180, 180 220"/>
        <path d="M 135 230 C 135 200, 142 185, 150 185 C 158 185, 165 200, 165 230"/>
        <!-- Scanner Laser Bar -->
        <line x1="60" y1="165" x2="240" y2="165" stroke="#EF4444" stroke-width="3" filter="url(#glow12)"/>
      </g>

      <!-- Laser Scanner Label -->
      <rect x="80" y="25" width="140" height="28" rx="6" fill="#1E293B" stroke="#0284C7"/>
      <text x="150" y="44" fill="#38BDF8" font-size="12" font-weight="700" text-anchor="middle" class="mono">OPTICAL / 3D IR</text>
    </g>

    <!-- Thai Descriptions -->
    <g transform="translate(30, 400)" class="thai">
      <rect width="330" height="90" rx="10" fill="#0B1528" stroke="#1E293B"/>
      <text x="16" y="32" fill="#E2E8F0" font-size="15" font-weight="600">• สแกนลายนิ้วมือ (Fingerprint)</text>
      <text x="28" y="56" fill="#94A3B8" font-size="13">เซนเซอร์ออปติคัล/ความจุไฟฟ้าจับเส้นนูนและร่อง</text>
      <text x="28" y="76" fill="#94A3B8" font-size="13">ความละเอียดระดับ 500 DPI ตามมาตรฐาน FBI</text>

      <rect y="105" width="330" height="90" rx="10" fill="#0B1528" stroke="#1E293B"/>
      <text x="16" y="137" fill="#E2E8F0" font-size="15" font-weight="600">• สแกนโครงหน้า 3 มิติ (3D Face Mesh)</text>
      <text x="28" y="161" fill="#94A3B8" font-size="13">ฉายจุดแสงอินฟราเรด 30,000 จุดตรวจวัดมิติลึก</text>
      <text x="28" y="181" fill="#94A3B8" font-size="13">ป้องกันการใช้ภาพถ่ายหรือวิดีโอหลอกระบบ (Liveness)</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(485, 570)">
    <circle cx="20" cy="20" r="26" fill="#0C4A6E" stroke="#38BDF8" stroke-width="2" filter="url(#glow12)"/>
    <path d="M 12 20 L 26 20 M 20 14 L 26 20 L 20 26" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ==================== STAGE 2: FEATURE EXTRACTION ==================== -->
  <g transform="translate(540, 260)" filter="url(#shadow12)">
    <rect width="390" height="660" rx="20" fill="url(#cardGrad12)" stroke="#06B6D4" stroke-width="2"/>
    <rect width="390" height="74" rx="20" fill="#164E63" fill-opacity="0.7"/>
    <rect x="20" y="18" width="40" height="38" rx="8" fill="#0891B2"/>
    <text x="40" y="44" fill="#FFFFFF" font-size="22" font-weight="800" text-anchor="middle" class="mono">2</text>
    <text x="76" y="38" fill="#FFFFFF" font-size="20" font-weight="700" class="thai">สกัดจุดเอกลักษณ์</text>
    <text x="76" y="58" fill="#67E8F9" font-size="13" class="mono">MINUTIAE EXTRACTION</text>

    <!-- Visual: Minutiae Extraction Matrix -->
    <g transform="translate(45, 110)">
      <rect width="300" height="250" rx="14" fill="#08101E" stroke="#155E75" stroke-width="1.5"/>
      
      <!-- Ridge Lines with Minutiae markers -->
      <g stroke="#06B6D4" stroke-width="2.5" fill="none" opacity="0.8">
        <path d="M 80 80 Q 150 50, 220 80"/>
        <path d="M 70 120 Q 150 90, 180 120"/> <!-- Ending -->
        <path d="M 90 160 Q 130 140, 150 155 Q 180 140, 220 160"/> <!-- Bifurcation -->
        <path d="M 80 200 Q 150 180, 220 200"/>
      </g>

      <!-- Minutiae Markers -->
      <circle cx="180" cy="120" r="7" fill="#F59E0B" filter="url(#glow12)"/>
      <text x="195" y="125" fill="#FBBF24" font-size="12" font-weight="700" class="thai">จุดปลายเส้น</text>

      <circle cx="150" cy="155" r="7" fill="#EC4899" filter="url(#glow12)"/>
      <text x="165" y="160" fill="#F472B6" font-size="12" font-weight="700" class="thai">จุดแยกเส้น</text>

      <circle cx="150" cy="70" r="7" fill="#10B981" filter="url(#glow12)"/>
      <text x="165" y="75" fill="#34D399" font-size="12" font-weight="700" class="thai">จุดศูนย์กลาง (Core)</text>
    </g>

    <!-- Thai Descriptions -->
    <g transform="translate(30, 400)" class="thai">
      <rect width="330" height="90" rx="10" fill="#0B1528" stroke="#1E293B"/>
      <text x="16" y="32" fill="#E2E8F0" font-size="15" font-weight="600">• สกัดจุด Minutiae Points</text>
      <text x="28" y="56" fill="#94A3B8" font-size="13">ตรวจหาจุดปลายเส้น (Ridge Ending)</text>
      <text x="28" y="76" fill="#94A3B8" font-size="13">และจุดแยกตัวของลายเส้น (Bifurcation)</text>

      <rect y="105" width="330" height="90" rx="10" fill="#0B1528" stroke="#1E293B"/>
      <text x="16" y="137" fill="#E2E8F0" font-size="15" font-weight="600">• บันทึกพิกัดคณิตศาสตร์ (X, Y, θ)</text>
      <text x="28" y="161" fill="#94A3B8" font-size="13">คำนวณตำแหน่งพิกัด X/Y และมุมองศาของเส้น</text>
      <text x="28" y="181" fill="#94A3B8" font-size="13">ไม่เก็บภาพถ่ายจริงเพื่อความปลอดภัยสูงสุด</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(945, 570)">
    <circle cx="20" cy="20" r="26" fill="#164E63" stroke="#06B6D4" stroke-width="2" filter="url(#glow12)"/>
    <path d="M 12 20 L 26 20 M 20 14 L 26 20 L 20 26" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ==================== STAGE 3: VECTOR TEMPLATE & ENCRYPTION ==================== -->
  <g transform="translate(1000, 260)" filter="url(#shadow12)">
    <rect width="390" height="660" rx="20" fill="url(#cardGrad12)" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="390" height="74" rx="20" fill="#4C1D95" fill-opacity="0.7"/>
    <rect x="20" y="18" width="40" height="38" rx="8" fill="#7C3AED"/>
    <text x="40" y="44" fill="#FFFFFF" font-size="22" font-weight="800" text-anchor="middle" class="mono">3</text>
    <text x="76" y="38" fill="#FFFFFF" font-size="20" font-weight="700" class="thai">แปลงเป็นเวกเตอร์ดิจิทัล</text>
    <text x="76" y="58" fill="#C4B5FD" font-size="13" class="mono">DIGITAL TEMPLATE &amp; HASH</text>

    <!-- Visual: Microprocessor & Hash Stream -->
    <g transform="translate(45, 110)">
      <rect width="300" height="250" rx="14" fill="#08101E" stroke="#3B0764" stroke-width="1.5"/>
      
      <!-- Microchip Card -->
      <rect x="80" y="40" width="140" height="70" rx="10" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="2"/>
      <text x="150" y="75" fill="#DDD6FE" font-size="16" font-weight="700" text-anchor="middle" class="mono">CRYPTO CHIP</text>
      <text x="150" y="95" fill="#A78BFA" font-size="11" text-anchor="middle" class="mono">SHA-256 HASH</text>

      <!-- Hash Stream Box -->
      <rect x="30" y="140" width="240" height="75" rx="8" fill="#0F0C29" stroke="#6D28D9"/>
      <text x="42" y="165" fill="#C084FC" font-size="11" font-weight="700" class="mono">FEATURE VECTOR DATA:</text>
      <text x="42" y="185" fill="#38BDF8" font-size="10" class="mono">[145.2, 89.1, 78.3°, 104]</text>
      <text x="42" y="202" fill="#34D399" font-size="10" class="mono">e3b0c44298fc1c149afbf4c8...</text>
    </g>

    <!-- Thai Descriptions -->
    <g transform="translate(30, 400)" class="thai">
      <rect width="330" height="90" rx="10" fill="#0B1528" stroke="#1E293B"/>
      <text x="16" y="32" fill="#E2E8F0" font-size="15" font-weight="600">• สร้างเวกเตอร์ทางคณิตศาสตร์</text>
      <text x="28" y="56" fill="#94A3B8" font-size="13">รวบรวมตำแหน่งพิกัดทั้งหมดเป็น Binary Vector</text>
      <text x="28" y="76" fill="#94A3B8" font-size="13">ขนาดไฟล์กะทัดรัดเพียง 256 - 512 ไบต์</text>

      <rect y="105" width="330" height="90" rx="10" fill="#0B1528" stroke="#1E293B"/>
      <text x="16" y="137" fill="#E2E8F0" font-size="15" font-weight="600">• การเข้ารหัสความปลอดภัย (Hash)</text>
      <text x="28" y="161" fill="#94A3B8" font-size="13">เข้ารหัสแบบ One-way Hash ทางคณิตศาสตร์</text>
      <text x="28" y="181" fill="#94A3B8" font-size="13">ไม่สามารถย้อนกลับ (Reverse-Engineer) เป็นภาพนิ้วได้</text>
    </g>
  </g>

  <!-- Arrow 3 -> 4 -->
  <g transform="translate(1405, 570)">
    <circle cx="20" cy="20" r="26" fill="#4C1D95" stroke="#8B5CF6" stroke-width="2" filter="url(#glow12)"/>
    <path d="M 12 20 L 26 20 M 20 14 L 26 20 L 20 26" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ==================== STAGE 4: VERIFICATION & ACCESS ==================== -->
  <g transform="translate(1460, 260)" filter="url(#shadow12)">
    <rect width="390" height="660" rx="20" fill="url(#cardGrad12)" stroke="#10B981" stroke-width="2"/>
    <rect width="390" height="74" rx="20" fill="#064E3B" fill-opacity="0.7"/>
    <rect x="20" y="18" width="40" height="38" rx="8" fill="#059669"/>
    <text x="40" y="44" fill="#FFFFFF" font-size="22" font-weight="800" text-anchor="middle" class="mono">4</text>
    <text x="76" y="38" fill="#FFFFFF" font-size="20" font-weight="700" class="thai">ตรวจสอบและอนุมัติ</text>
    <text x="76" y="58" fill="#6EE7B7" font-size="13" class="mono">MATCH &amp; ACCESS GRANTED</text>

    <!-- Visual: Matching Score & Shield -->
    <g transform="translate(45, 110)">
      <rect width="300" height="250" rx="14" fill="#08101E" stroke="#065F46" stroke-width="1.5"/>
      
      <!-- Success Badge -->
      <circle cx="150" cy="85" r="45" fill="#064E3B" stroke="#10B981" stroke-width="3" filter="url(#glow12)"/>
      <path d="M 135 85 L 146 96 L 168 74" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="40" y="155" width="220" height="65" rx="10" fill="#022C22" stroke="#10B981"/>
      <text x="150" y="182" fill="#34D399" font-size="18" font-weight="700" text-anchor="middle" class="thai">ยืนยันตัวตนสำเร็จ</text>
      <text x="150" y="205" fill="#A7F3D0" font-size="12" text-anchor="middle" class="mono">MATCH SCORE: 99.8% (FAR &lt; 0.001%)</text>
    </g>

    <!-- Thai Descriptions -->
    <g transform="translate(30, 400)" class="thai">
      <rect width="330" height="90" rx="10" fill="#0B1528" stroke="#1E293B"/>
      <text x="16" y="32" fill="#E2E8F0" font-size="15" font-weight="600">• เปรียบเทียบกับฐานข้อมูล (Matching)</text>
      <text x="28" y="56" fill="#94A3B8" font-size="13">โหมด 1:1 ยืนยันว่าใช่บุคคลที่อ้างหรือไม่</text>
      <text x="28" y="76" fill="#94A3B8" font-size="13">โหมด 1:N ค้นหาว่าเป็นใครในฐานข้อมูลทั้งหมด</text>

      <rect y="105" width="330" height="90" rx="10" fill="#0B1528" stroke="#1E293B"/>
      <text x="16" y="137" fill="#E2E8F0" font-size="15" font-weight="600">• ประเมินเกณฑ์ความปลอดภัย</text>
      <text x="28" y="161" fill="#94A3B8" font-size="13">ตั้งค่าเกณฑ์ความคลาดเคลื่อน FAR และ FRR</text>
      <text x="28" y="181" fill="#94A3B8" font-size="13">ปลดล็อกประตูหรืออนุมัติสิทธิ์เข้าใช้งานทันที</text>
    </g>
  </g>

</svg>