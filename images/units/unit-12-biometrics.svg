<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Technical Grid Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4 8" opacity="0.3">
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="640" x2="1280" y2="640"/>
    <line x1="330" y1="0" x2="330" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="950" y1="0" x2="950" y2="720"/>
  </g>


  <rect x="50" y="24" width="1180" height="74" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="80" y="52" font-family="'Stack Sans Notch', sans-serif" font-size="17" font-weight="700" fill="#38BDF8">
    BIOMETRIC FEATURE EXTRACTION &amp; TEMPLATE MATCHING
  </text>
  <text x="80" y="78" font-family="'Mitr', sans-serif" font-size="13" font-weight="400" fill="#94A3B8">
    กระบวนการแปลงลายนิ้วมือ/ใบหน้าเป็นเทมเพลตทางคณิตศาสตร์และการจับคู่
  </text>

  <!-- STEP 1: Feature Acquisition -->
  <g transform="translate(50, 115)" filter="url(#cardShadow)">
    <rect width="270" height="565" rx="12" fill="#131E36" stroke="#2563EB" stroke-width="1.8"/>
    <rect width="270" height="46" rx="12" fill="#1E293B"/>
    <rect x="14" y="9" width="76" height="28" rx="6" fill="#2563EB"/>
    <text x="52" y="28" font-family="'Stack Sans Notch', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">STEP 01</text>
    <text x="100" y="29" font-family="'Mitr', sans-serif" font-size="14.5" font-weight="600" fill="#FFFFFF">Raw Capture</text>
    <g transform="translate(14, 58)">
      <rect width="242" height="150" rx="8" fill="#0B1324" stroke="#1E293B"/>
      <!-- Realistic Fingerprint Ridge schematic -->
      <g transform="translate(85, 20)">
        <path d="M 35 10 A 25 35 0 0 1 35 80" fill="none" stroke="#60A5FA" stroke-width="2"/>
        <path d="M 35 20 A 15 25 0 0 1 35 70" fill="none" stroke="#60A5FA" stroke-width="2"/>
        <path d="M 35 30 A 8 15 0 0 1 35 60" fill="none" stroke="#60A5FA" stroke-width="2"/>
        <circle cx="35" cy="45" r="4" fill="#38BDF8"/>
      </g>
      <text x="121" y="125" font-family="'Stack Sans Notch', sans-serif" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">CAPACITIVE SENSOR 508 DPI</text>
    </g>
    <g transform="translate(16, 230)">
      <text x="0" y="16" font-family="'Mitr', sans-serif" font-size="13.5" font-weight="600" fill="#38BDF8">การบันทึกลักษณะทางกายภาพ:</text>
      <text x="0" y="42" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• เซนเซอร์ประจุไฟฟ้า (Capacitive)</text>
      <text x="0" y="68" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• ตรวจวัดความลึกของสันและร่องลายนิ้วมือ</text>
      <text x="0" y="94" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• หรือใช้กล้องอินฟราเรดสแกนม่านตา</text>
      <text x="0" y="120" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• ได้ภาพดิบความละเอียด 508 จุดต่อนิ้ว</text>
      <rect x="0" y="270" width="238" height="36" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="119" y="293" font-family="'Mitr', sans-serif" font-size="12.5" fill="#93C5FD" text-anchor="middle">ภาพดิบทางกายภาพ (Raw Image)</text>
    </g>
  </g>

  <!-- Arrow 1->2 -->
  <g transform="translate(328, 380)"><circle cx="10" cy="0" r="13" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/><path d="M 6 -5 L 14 0 L 6 5" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/></g>

  <!-- STEP 2: Minutiae Feature Extraction -->
  <g transform="translate(350, 115)" filter="url(#cardShadow)">
    <rect width="270" height="565" rx="12" fill="#131E36" stroke="#0284C7" stroke-width="1.8"/>
    <rect width="270" height="46" rx="12" fill="#1E293B"/>
    <rect x="14" y="9" width="76" height="28" rx="6" fill="#0284C7"/>
    <text x="52" y="28" font-family="'Stack Sans Notch', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">STEP 02</text>
    <text x="100" y="29" font-family="'Mitr', sans-serif" font-size="14.5" font-weight="600" fill="#FFFFFF">Minutiae Extract</text>
    <g transform="translate(14, 58)">
      <rect width="242" height="150" rx="8" fill="#0B1324" stroke="#1E293B"/>
      <!-- Minutiae points -->
      <g transform="translate(30, 25)">
        <line x1="20" y1="30" x2="80" y2="30" stroke="#38BDF8" stroke-width="2"/>
        <circle cx="80" cy="30" r="5" fill="#EF4444"/>
        <text x="95" y="34" font-family="'Stack Sans Notch', sans-serif" font-size="10.5" fill="#EF4444">RIDGE ENDING</text>
        <line x1="20" y1="70" x2="60" y2="70" stroke="#38BDF8" stroke-width="2"/>
        <line x1="60" y1="70" x2="90" y2="55" stroke="#38BDF8" stroke-width="2"/>
        <line x1="60" y1="70" x2="90" y2="85" stroke="#38BDF8" stroke-width="2"/>
        <circle cx="60" cy="70" r="5" fill="#10B981"/>
        <text x="95" y="74" font-family="'Stack Sans Notch', sans-serif" font-size="10.5" fill="#34D399">BIFURCATION</text>
      </g>
    </g>
    <g transform="translate(16, 230)">
      <text x="0" y="16" font-family="'Mitr', sans-serif" font-size="13.5" font-weight="600" fill="#38BDF8">การสกัดจุดเอกลักษณ์:</text>
      <text x="0" y="42" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• Binarization &amp; Thinning ลดเส้นเหลือ 1px</text>
      <text x="0" y="68" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• ตรวจจับจุดสิ้นสุดเส้น (Ridge Ending)</text>
      <text x="0" y="94" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• ตรวจจับจุดแยกสองแพร่ง (Bifurcation)</text>
      <text x="0" y="120" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• กำหนดพิกัด (X, Y) และมุมองศา Theta</text>
      <rect x="0" y="270" width="238" height="36" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="119" y="293" font-family="'Mitr', sans-serif" font-size="12.5" fill="#38BDF8" text-anchor="middle">ได้จุด Minutiae พิกัดแม่นยำ</text>
    </g>
  </g>

  <!-- Arrow 2->3 -->
  <g transform="translate(628, 380)"><circle cx="10" cy="0" r="13" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/><path d="M 6 -5 L 14 0 L 6 5" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/></g>

  <!-- STEP 3: Mathematical Template Generation -->
  <g transform="translate(650, 115)" filter="url(#cardShadow)">
    <rect width="270" height="565" rx="12" fill="#131E36" stroke="#10B981" stroke-width="1.8"/>
    <rect width="270" height="46" rx="12" fill="#1E293B"/>
    <rect x="14" y="9" width="76" height="28" rx="6" fill="#10B981"/>
    <text x="52" y="28" font-family="'Stack Sans Notch', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">STEP 03</text>
    <text x="100" y="29" font-family="'Mitr', sans-serif" font-size="14.5" font-weight="600" fill="#FFFFFF">Math Template</text>
    <g transform="translate(14, 58)">
      <rect width="242" height="150" rx="8" fill="#0B1324" stroke="#1E293B"/>
      <!-- Encrypted binary template -->
      <rect x="20" y="25" width="202" height="45" rx="4" fill="#1E293B" stroke="#10B981"/>
      <text x="121" y="47" font-family="'Stack Sans Notch', sans-serif" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">ONE-WAY HASH TEMPLATE</text>
      <text x="121" y="62" font-family="'Stack Sans Notch', sans-serif" font-size="9.5" fill="#94A3B8" text-anchor="middle">ZERO RAW IMAGE STORED</text>
      <text x="121" y="115" font-family="'Mitr', sans-serif" font-size="11" fill="#E2E8F0" text-anchor="middle">แปลงภาพเป็นสมการทางคณิตศาสตร์</text>
    </g>
    <g transform="translate(16, 230)">
      <text x="0" y="16" font-family="'Mitr', sans-serif" font-size="13.5" font-weight="600" fill="#34D399">การสร้างเทมเพลตปลอดภัย:</text>
      <text x="0" y="42" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• แปลงพิกัดเป็นเวกเตอร์ทางคณิตศาสตร์</text>
      <text x="0" y="68" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• ระบบจะไม่เก็บรูปถ่ายจริงเด็ดขาด</text>
      <text x="0" y="94" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• ไม่สามารถย้อนกลับเป็นรูปลายนิ้วมือได้</text>
      <text x="0" y="120" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• บันทึกเฉพาะไฟล์เทมเพลตขนาดเล็ก (KB)</text>
      <rect x="0" y="270" width="238" height="36" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="119" y="293" font-family="'Mitr', sans-serif" font-size="12.5" fill="#A7F3D0" text-anchor="middle">ปลอดภัยตามมาตรฐาน PDPA</text>
    </g>
  </g>

  <!-- Arrow 3->4 -->
  <g transform="translate(928, 380)"><circle cx="10" cy="0" r="13" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/><path d="M 6 -5 L 14 0 L 6 5" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/></g>

  <!-- STEP 4: Matching Score Decision -->
  <g transform="translate(950, 115)" filter="url(#cardShadow)">
    <rect width="280" height="565" rx="12" fill="#131E36" stroke="#F59E0B" stroke-width="1.8"/>
    <rect width="280" height="46" rx="12" fill="#1E293B"/>
    <rect x="14" y="9" width="76" height="28" rx="6" fill="#F59E0B"/>
    <text x="52" y="28" font-family="'Stack Sans Notch', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">STEP 04</text>
    <text x="100" y="29" font-family="'Mitr', sans-serif" font-size="14.5" font-weight="600" fill="#FFFFFF">1:1 / 1:N Match</text>
    <g transform="translate(14, 58)">
      <rect width="252" height="150" rx="8" fill="#0B1324" stroke="#1E293B"/>
      <!-- Match decision -->
      <rect x="25" y="25" width="202" height="50" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="126" y="47" font-family="'Stack Sans Notch', sans-serif" font-size="12" font-weight="700" fill="#FBBF24" text-anchor="middle">MATCH SCORE: 98.4%</text>
      <text x="126" y="63" font-family="'Stack Sans Notch', sans-serif" font-size="10.5" fill="#34D399" text-anchor="middle">THRESHOLD: &gt;= 85% PASS</text>
      <text x="126" y="115" font-family="'Mitr', sans-serif" font-size="11" fill="#38BDF8" text-anchor="middle">ปลดล็อกยืนยันตัวตนสำเร็จ</text>
    </g>
    <g transform="translate(16, 230)">
      <text x="0" y="16" font-family="'Mitr', sans-serif" font-size="13.5" font-weight="600" fill="#FBBF24">การจับคู่และตัดสินผล:</text>
      <text x="0" y="42" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• โหมด 1:1 เทียบกับรหัสประจำตัวผู้ใช้</text>
      <text x="0" y="68" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• โหมด 1:N ค้นหาทั้งฐานข้อมูลระบบ</text>
      <text x="0" y="94" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• คำนวณระยะห่าง Euclidean Distance</text>
      <text x="0" y="120" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• ควบคุมอัตราผิดพลาด FAR และ FRR</text>
      <rect x="0" y="270" width="248" height="36" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="124" y="293" font-family="'Mitr', sans-serif" font-size="12.5" fill="#FDE68A" text-anchor="middle">แม่นยำสูง ปลอมแปลงไม่ได้</text>
    </g>
  </g>

</svg>