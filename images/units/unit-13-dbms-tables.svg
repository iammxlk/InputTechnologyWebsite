<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad13" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#101D42"/>
      <stop offset="100%" stop-color="#0D1B2A"/>
    </linearGradient>
    <linearGradient id="cardGrad13" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="headerBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="headerCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="headerAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow13" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="neonGlow13">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Stack Sans Notch', 'Segoe UI Mono', monospace; font-variant-numeric: tabular-nums; }
    .thai { font-family: 'Mitr', 'Segoe UI', system-ui, sans-serif; }
  </style>

  <!-- Deep High-Tech Background -->
  <rect width="1280" height="720" fill="url(#bgGrad13)"/>

  <!-- Subtle Blueprint Grid Pattern -->
  <g stroke="#38BDF8" stroke-opacity="0.06" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="720"/><line x1="160" y1="0" x2="160" y2="720"/>
    <line x1="240" y1="0" x2="240" y2="720"/><line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="400" y1="0" x2="400" y2="720"/><line x1="480" y1="0" x2="480" y2="720"/>
    <line x1="560" y1="0" x2="560" y2="720"/><line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="720" y1="0" x2="720" y2="720"/><line x1="800" y1="0" x2="800" y2="720"/>
    <line x1="880" y1="0" x2="880" y2="720"/><line x1="960" y1="0" x2="960" y2="720"/>
    <line x1="1040" y1="0" x2="1040" y2="720"/><line x1="1120" y1="0" x2="1120" y2="720"/>
    <line x1="1200" y1="0" x2="1200" y2="720"/>
    <line x1="0" y1="80" x2="1280" y2="80"/><line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/><line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/><line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/><line x1="0" y1="640" x2="1280" y2="640"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(64, 40)">
    <rect width="420" height="34" rx="6" fill="#1E293B" stroke="#334155"/>
    <circle cx="18" cy="17" r="5" fill="#38BDF8"/>
    <text x="32" y="22" fill="#38BDF8" font-size="13" font-weight="700" class="mono">RELATIONAL DBMS ARCHITECTURE (1:N DATA SCHEMA)</text>
    <text x="0" y="64" fill="#F8FAFC" font-size="22" font-weight="600" class="thai">โครงสร้างความสัมพันธ์ฐานข้อมูลและคีย์เชื่อมโยง (PK/FK Relations)</text>
  </g>

  <!-- ==================== TABLE 1: STUDENTS (Parent Table) ==================== -->
  <g transform="translate(64, 150)" filter="url(#shadow13)">
    <!-- Card Frame -->
    <rect width="340" height="360" rx="12" fill="url(#cardGrad13)" stroke="#334155" stroke-width="1.5"/>
    <!-- Header -->
    <path d="M 0 12 Q 0 0 12 0 L 328 0 Q 340 0 340 12 L 340 50 L 0 50 Z" fill="url(#headerBlue)"/>
    <text x="18" y="32" fill="#FFFFFF" font-size="16" font-weight="700" class="mono">TABLE: students</text>
    <rect x="250" y="16" width="72" height="20" rx="4" fill="#1E3A8A"/>
    <text x="260" y="30" fill="#93C5FD" font-size="10" font-weight="700" class="mono">MASTER ENTITY</text>

    <!-- Table Columns -->
    <g transform="translate(18, 70)" class="mono" font-size="12">
      <!-- Row 1: PK -->
      <rect x="-6" y="-6" width="316" height="36" rx="6" fill="#1E3A5F" fill-opacity="0.4" stroke="#0284C7" stroke-width="1"/>
      <rect x="0" y="0" width="30" height="18" rx="4" fill="#F59E0B"/>
      <text x="7" y="13" fill="#FFFFFF" font-size="10" font-weight="800">PK</text>
      <text x="38" y="14" fill="#F8FAFC" font-weight="700">student_id</text>
      <text x="190" y="14" fill="#94A3B8">VARCHAR(12)</text>

      <!-- Row 2 -->
      <g transform="translate(0, 42)">
        <text x="38" y="14" fill="#E2E8F0">full_name</text>
        <text x="190" y="14" fill="#94A3B8">VARCHAR(100)</text>
      </g>
      <!-- Row 3 -->
      <g transform="translate(0, 78)">
        <text x="38" y="14" fill="#E2E8F0">department</text>
        <text x="190" y="14" fill="#94A3B8">VARCHAR(60)</text>
      </g>
      <!-- Row 4 -->
      <g transform="translate(0, 114)">
        <text x="38" y="14" fill="#E2E8F0">avatar_url</text>
        <text x="190" y="14" fill="#94A3B8">TEXT</text>
      </g>
      <!-- Row 5 -->
      <g transform="translate(0, 150)">
        <text x="38" y="14" fill="#E2E8F0">created_at</text>
        <text x="190" y="14" fill="#94A3B8">DATETIME</text>
      </g>
      <!-- Row 6 -->
      <g transform="translate(0, 186)">
        <text x="38" y="14" fill="#E2E8F0">is_active</text>
        <text x="190" y="14" fill="#94A3B8">BOOLEAN</text>
      </g>
    </g>

    <!-- Sample Data Preview -->
    <g transform="translate(18, 305)">
      <rect width="304" height="38" rx="6" fill="#0B1329" stroke="#1E293B"/>
      <text x="12" y="16" fill="#64748B" font-size="10" class="mono">SAMPLE ROW (JSON):</text>
      <text x="12" y="30" fill="#38BDF8" font-size="11" class="mono">{"id":"6720101015", "name":"นายสมคิด"}</text>
    </g>
  </g>

  <!-- ==================== TABLE 2: QUIZ_SCORES (Child Relation 1) ==================== -->
  <g transform="translate(480, 150)" filter="url(#shadow13)">
    <rect width="340" height="360" rx="12" fill="url(#cardGrad13)" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 12 Q 0 0 12 0 L 328 0 Q 340 0 340 12 L 340 50 L 0 50 Z" fill="url(#headerCyan)"/>
    <text x="18" y="32" fill="#FFFFFF" font-size="16" font-weight="700" class="mono">TABLE: quiz_scores</text>
    <rect x="250" y="16" width="72" height="20" rx="4" fill="#064E3B"/>
    <text x="263" y="30" fill="#6EE7B7" font-size="10" font-weight="700" class="mono">RELATION 1:N</text>

    <g transform="translate(18, 70)" class="mono" font-size="12">
      <!-- PK -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="30" height="18" rx="4" fill="#F59E0B"/>
        <text x="7" y="13" fill="#FFFFFF" font-size="10" font-weight="800">PK</text>
        <text x="38" y="14" fill="#F8FAFC" font-weight="700">score_id</text>
        <text x="190" y="14" fill="#94A3B8">BIGINT AUTO</text>
      </g>
      <!-- FK to students -->
      <g transform="translate(0, 36)">
        <rect x="-6" y="-4" width="316" height="30" rx="6" fill="#047857" fill-opacity="0.25" stroke="#10B981" stroke-width="1"/>
        <rect x="0" y="0" width="30" height="18" rx="4" fill="#0284C7"/>
        <text x="7" y="13" fill="#FFFFFF" font-size="10" font-weight="800">FK</text>
        <text x="38" y="14" fill="#38BDF8" font-weight="700">student_id</text>
        <text x="190" y="14" fill="#94A3B8">VARCHAR(12)</text>
      </g>
      <!-- Row 3 -->
      <g transform="translate(0, 78)">
        <text x="38" y="14" fill="#E2E8F0">unit_no</text>
        <text x="190" y="14" fill="#94A3B8">TINYINT (1-16)</text>
      </g>
      <!-- Row 4 -->
      <g transform="translate(0, 114)">
        <text x="38" y="14" fill="#E2E8F0">score</text>
        <text x="190" y="14" fill="#94A3B8">TINYINT (0-10)</text>
      </g>
      <!-- Row 5 -->
      <g transform="translate(0, 150)">
        <text x="38" y="14" fill="#E2E8F0">time_seconds</text>
        <text x="190" y="14" fill="#94A3B8">INT UNSIGNED</text>
      </g>
      <!-- Row 6 -->
      <g transform="translate(0, 186)">
        <text x="38" y="14" fill="#E2E8F0">is_passed</text>
        <text x="190" y="14" fill="#94A3B8">BOOLEAN (>=8)</text>
      </g>
    </g>

    <g transform="translate(18, 305)">
      <rect width="304" height="38" rx="6" fill="#0B1329" stroke="#1E293B"/>
      <text x="12" y="16" fill="#64748B" font-size="10" class="mono">SAMPLE ROW (SQL):</text>
      <text x="12" y="30" fill="#34D399" font-size="11" class="mono">INSERT: (101, '6720101015', 1, 9, 74)</text>
    </g>
  </g>

  <!-- ==================== TABLE 3: MINIGAME_RECORDS (Child Relation 2) ==================== -->
  <g transform="translate(876, 150)" filter="url(#shadow13)">
    <rect width="340" height="360" rx="12" fill="url(#cardGrad13)" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 12 Q 0 0 12 0 L 328 0 Q 340 0 340 12 L 340 50 L 0 50 Z" fill="url(#headerAmber)"/>
    <text x="18" y="32" fill="#FFFFFF" font-size="16" font-weight="700" class="mono">TABLE: minigame_records</text>
    <rect x="250" y="16" width="72" height="20" rx="4" fill="#78350F"/>
    <text x="263" y="30" fill="#FDE68A" font-size="10" font-weight="700" class="mono">RELATION 1:N</text>

    <g transform="translate(18, 70)" class="mono" font-size="12">
      <!-- PK -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="30" height="18" rx="4" fill="#F59E0B"/>
        <text x="7" y="13" fill="#FFFFFF" font-size="10" font-weight="800">PK</text>
        <text x="38" y="14" fill="#F8FAFC" font-weight="700">record_id</text>
        <text x="190" y="14" fill="#94A3B8">BIGINT AUTO</text>
      </g>
      <!-- FK to students -->
      <g transform="translate(0, 36)">
        <rect x="-6" y="-4" width="316" height="30" rx="6" fill="#78350F" fill-opacity="0.3" stroke="#F59E0B" stroke-width="1"/>
        <rect x="0" y="0" width="30" height="18" rx="4" fill="#0284C7"/>
        <text x="7" y="13" fill="#FFFFFF" font-size="10" font-weight="800">FK</text>
        <text x="38" y="14" fill="#FBBF24" font-weight="700">student_id</text>
        <text x="190" y="14" fill="#94A3B8">VARCHAR(12)</text>
      </g>
      <!-- Row 3 -->
      <g transform="translate(0, 78)">
        <text x="38" y="14" fill="#E2E8F0">game_id</text>
        <text x="190" y="14" fill="#94A3B8">VARCHAR(6) (G01)</text>
      </g>
      <!-- Row 4 -->
      <g transform="translate(0, 114)">
        <text x="38" y="14" fill="#E2E8F0">best_score</text>
        <text x="190" y="14" fill="#94A3B8">INT (0-20)</text>
      </g>
      <!-- Row 5 -->
      <g transform="translate(0, 150)">
        <text x="38" y="14" fill="#E2E8F0">best_time_sec</text>
        <text x="190" y="14" fill="#94A3B8">INT (1-60s)</text>
      </g>
      <!-- Row 6 -->
      <g transform="translate(0, 186)">
        <text x="38" y="14" fill="#E2E8F0">play_count</text>
        <text x="190" y="14" fill="#94A3B8">INT DEFAULT 1</text>
      </g>
    </g>

    <g transform="translate(18, 305)">
      <rect width="304" height="38" rx="6" fill="#0B1329" stroke="#1E293B"/>
      <text x="12" y="16" fill="#64748B" font-size="10" class="mono">SAMPLE ROW (SQL):</text>
      <text x="12" y="30" fill="#FBBF24" font-size="11" class="mono">INSERT: (501, '6720101015', 'G01', 20)</text>
    </g>
  </g>

  <!-- ==================== RELATIONAL CONNECTORS (Crow's Foot Lines) ==================== -->
  <!-- Line 1: students.student_id -> quiz_scores.student_id -->
  <g stroke="#38BDF8" stroke-width="2.5" fill="none" filter="url(#neonGlow13)">
    <!-- Path from left table PK to middle table FK -->
    <path d="M 404 232 L 442 232 L 442 268 L 480 268"/>
    <!-- Parent side (One): One vertical bar -->
    <line x1="412" y1="226" x2="412" y2="238" stroke="#38BDF8" stroke-width="2.5"/>
    <line x1="418" y1="226" x2="418" y2="238" stroke="#38BDF8" stroke-width="2.5"/>
    <!-- Child side (Many): Crow's foot -->
    <path d="M 474 262 L 480 268 L 474 274" fill="none"/>
    <line x1="468" y1="262" x2="468" y2="274"/>
  </g>

  <!-- Line 2: students.student_id -> minigame_records.student_id (Upper Arch) -->
  <g stroke="#F59E0B" stroke-width="2.5" fill="none" filter="url(#neonGlow13)">
    <path d="M 404 232 L 452 232 L 452 130 L 848 130 L 848 268 L 876 268"/>
    <!-- Child side Crow's Foot -->
    <path d="M 870 262 L 876 268 L 870 274" fill="none"/>
    <line x1="864" y1="262" x2="864" y2="274"/>
  </g>

  <!-- ==================== SQL JOIN CONSOLE (Bottom Enterprise Panel) ==================== -->
  <g transform="translate(64, 540)" filter="url(#shadow13)">
    <rect width="1152" height="140" rx="10" fill="#0A0F1D" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="0" y="0" width="1152" height="32" rx="10" fill="#151E32"/>
    <circle cx="20" cy="16" r="4.5" fill="#EF4444"/>
    <circle cx="36" cy="16" r="4.5" fill="#F59E0B"/>
    <circle cx="52" cy="16" r="4.5" fill="#10B981"/>
    <text x="76" y="21" fill="#94A3B8" font-size="12" class="mono">TERMINAL: SQL JOIN EXECUTION &amp; DATA RETRIEVAL (21901-2017)</text>

    <!-- Query Text -->
    <g transform="translate(20, 54)" class="mono" font-size="13">
      <text x="0" y="0">
        <tspan fill="#F43F5E" font-weight="700">SELECT </tspan>
        <tspan fill="#E2E8F0">s.student_id, s.full_name, q.unit_no, q.score, q.time_seconds, m.best_score AS minigame_pts</tspan>
      </text>
      <text x="0" y="24">
        <tspan fill="#F43F5E" font-weight="700">FROM </tspan>
        <tspan fill="#38BDF8">students s</tspan>
        <tspan fill="#F43F5E" font-weight="700"> INNER JOIN </tspan>
        <tspan fill="#34D399">quiz_scores q </tspan>
        <tspan fill="#F43F5E" font-weight="700">ON </tspan>
        <tspan fill="#E2E8F0">s.student_id = q.student_id</tspan>
        <tspan fill="#F43F5E" font-weight="700"> LEFT JOIN </tspan>
        <tspan fill="#FBBF24">minigame_records m </tspan>
        <tspan fill="#F43F5E" font-weight="700">ON </tspan>
        <tspan fill="#E2E8F0">s.student_id = m.student_id</tspan>
      </text>
      <text x="0" y="48">
        <tspan fill="#F43F5E" font-weight="700">WHERE </tspan>
        <tspan fill="#E2E8F0">q.is_passed = 1 </tspan>
        <tspan fill="#F43F5E" font-weight="700">ORDER BY </tspan>
        <tspan fill="#E2E8F0">(SUM(q.score) + SUM(m.best_score)) </tspan>
        <tspan fill="#F43F5E" font-weight="700">DESC, </tspan>
        <tspan fill="#E2E8F0">q.time_seconds </tspan>
        <tspan fill="#F43F5E" font-weight="700">ASC LIMIT </tspan>
        <tspan fill="#A78BFA">10;</tspan>
        <tspan fill="#10B981"> -- [SUCCESS: 10 rows retrieved in 1.42ms]</tspan>
      </text>
    </g>
  </g>
</svg>
