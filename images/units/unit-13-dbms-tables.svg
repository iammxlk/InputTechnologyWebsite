<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Technical Grid Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4 8" opacity="0.3">
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="640" x2="1280" y2="640"/>
    <line x1="330" y1="0" x2="330" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="950" y1="0" x2="950" y2="720"/>
  </g>


  <rect x="50" y="24" width="1180" height="74" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="80" y="52" font-family="'Stack Sans Notch', sans-serif" font-size="17" font-weight="700" fill="#38BDF8">
    RELATIONAL DATABASE SCHEMA &amp; FOREIGN KEY LINKAGE
  </text>
  <text x="80" y="78" font-family="'Mitr', sans-serif" font-size="13" font-weight="400" fill="#94A3B8">
    สถาปัตยกรรมตารางข้อมูลเชิงสัมพันธ์ คีย์หลัก และคีย์นอกเชื่อมโยงข้อมูล
  </text>

  <!-- TABLE A: Students Table (Left) -->
  <g transform="translate(60, 115)" filter="url(#cardShadow)">
    <rect width="440" height="565" rx="14" fill="#131E36" stroke="#2563EB" stroke-width="2"/>
    <rect width="440" height="52" rx="14" fill="#1E293B"/>
    <rect x="18" y="11" width="120" height="30" rx="6" fill="#2563EB"/>
    <text x="78" y="31" font-family="'Stack Sans Notch', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">TABLE 01</text>
    <text x="150" y="32" font-family="'Stack Sans Notch', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">students</text>

    <!-- Schema Columns -->
    <g transform="translate(20, 70)">
      <!-- PK Column -->
      <rect width="400" height="42" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
      <rect x="10" y="10" width="36" height="22" rx="4" fill="#2563EB"/>
      <text x="28" y="26" font-family="'Stack Sans Notch', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">PK</text>
      <text x="56" y="27" font-family="'Stack Sans Notch', sans-serif" font-size="13" font-weight="700" fill="#38BDF8">student_id</text>
      <text x="390" y="27" font-family="'Stack Sans Notch', sans-serif" font-size="11" fill="#94A3B8" text-anchor="end">VARCHAR(10)</text>

      <g transform="translate(0, 50)">
        <rect width="400" height="36" rx="4" fill="#0B1324" stroke="#334155"/>
        <text x="20" y="23" font-family="'Stack Sans Notch', sans-serif" font-size="12" fill="#E2E8F0">full_name</text>
        <text x="390" y="23" font-family="'Stack Sans Notch', sans-serif" font-size="11" fill="#94A3B8" text-anchor="end">VARCHAR(100)</text>
      </g>
      <g transform="translate(0, 92)">
        <rect width="400" height="36" rx="4" fill="#0B1324" stroke="#334155"/>
        <text x="20" y="23" font-family="'Stack Sans Notch', sans-serif" font-size="12" fill="#E2E8F0">password_hash</text>
        <text x="390" y="23" font-family="'Stack Sans Notch', sans-serif" font-size="11" fill="#94A3B8" text-anchor="end">VARCHAR(64)</text>
      </g>
      <g transform="translate(0, 134)">
        <rect width="400" height="36" rx="4" fill="#0B1324" stroke="#334155"/>
        <text x="20" y="23" font-family="'Stack Sans Notch', sans-serif" font-size="12" fill="#E2E8F0">class_group</text>
        <text x="390" y="23" font-family="'Stack Sans Notch', sans-serif" font-size="11" fill="#94A3B8" text-anchor="end">VARCHAR(20)</text>
      </g>
      <g transform="translate(0, 176)">
        <rect width="400" height="36" rx="4" fill="#0B1324" stroke="#334155"/>
        <text x="20" y="23" font-family="'Stack Sans Notch', sans-serif" font-size="12" fill="#E2E8F0">created_at</text>
        <text x="390" y="23" font-family="'Stack Sans Notch', sans-serif" font-size="11" fill="#94A3B8" text-anchor="end">TIMESTAMP</text>
      </g>
    </g>

    <!-- Table Details -->
    <g transform="translate(25, 310)">
      <text x="0" y="20" font-family="'Mitr', sans-serif" font-size="14.5" font-weight="600" fill="#38BDF8">หน้าที่ทางโครงสร้างข้อมูล:</text>
      <text x="0" y="50" font-family="'Mitr', sans-serif" font-size="13" fill="#CBD5E1">• student_id เป็น Primary Key ไม่ซ้ำกันเด็ดขาด</text>
      <text x="0" y="76" font-family="'Mitr', sans-serif" font-size="13" fill="#CBD5E1">• เก็บข้อมูลหลัก 1 แถวต่อผู้เรียน 1 คน</text>
      <text x="0" y="102" font-family="'Mitr', sans-serif" font-size="13" fill="#CBD5E1">• สร้าง Index เพื่อการค้นหาด้วยความเร็ว O(log N)</text>
      <rect x="0" y="140" width="390" height="42" rx="8" fill="#1E293B" stroke="#334155"/>
      <text x="195" y="167" font-family="'Mitr', sans-serif" font-size="13" font-weight="500" fill="#93C5FD" text-anchor="middle">ตารางหลักผู้ใช้งาน (Parent Entity)</text>
    </g>
  </g>

  <!-- MIDDLE RELATION CONNECTOR -->
  <g transform="translate(500, 200)">
    <!-- Relationship Diamond -->
    <polygon points="140,50 190,100 140,150 90,100" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <text x="140" y="96" font-family="'Stack Sans Notch', sans-serif" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="middle">1 : N</text>
    <text x="140" y="114" font-family="'Mitr', sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">เชื่อมโยง</text>
    <line x1="0" y1="100" x2="90" y2="100" stroke="#38BDF8" stroke-width="2"/>
    <line x1="190" y1="100" x2="280" y2="100" stroke="#38BDF8" stroke-width="2"/>
  </g>

  <!-- TABLE B: Learning Logs Table (Right) -->
  <g transform="translate(780, 115)" filter="url(#cardShadow)">
    <rect width="440" height="565" rx="14" fill="#131E36" stroke="#10B981" stroke-width="2"/>
    <rect width="440" height="52" rx="14" fill="#1E293B"/>
    <rect x="18" y="11" width="120" height="30" rx="6" fill="#10B981"/>
    <text x="78" y="31" font-family="'Stack Sans Notch', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">TABLE 02</text>
    <text x="150" y="32" font-family="'Stack Sans Notch', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">learning_logs</text>

    <!-- Schema Columns -->
    <g transform="translate(20, 70)">
      <!-- PK Column -->
      <rect width="400" height="42" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
      <rect x="10" y="10" width="36" height="22" rx="4" fill="#10B981"/>
      <text x="28" y="26" font-family="'Stack Sans Notch', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">PK</text>
      <text x="56" y="27" font-family="'Stack Sans Notch', sans-serif" font-size="13" font-weight="700" fill="#34D399">log_id</text>
      <text x="390" y="27" font-family="'Stack Sans Notch', sans-serif" font-size="11" fill="#94A3B8" text-anchor="end">BIGINT AUTO_INC</text>

      <!-- FK Column -->
      <g transform="translate(0, 50)">
        <rect width="400" height="42" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
        <rect x="10" y="10" width="36" height="22" rx="4" fill="#0284C7"/>
        <text x="28" y="26" font-family="'Stack Sans Notch', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">FK</text>
        <text x="56" y="27" font-family="'Stack Sans Notch', sans-serif" font-size="13" font-weight="700" fill="#38BDF8">student_id</text>
        <text x="390" y="27" font-family="'Stack Sans Notch', sans-serif" font-size="11" fill="#94A3B8" text-anchor="end">REFERENCES students</text>
      </g>
      <g transform="translate(0, 100)">
        <rect width="400" height="36" rx="4" fill="#0B1324" stroke="#334155"/>
        <text x="20" y="23" font-family="'Stack Sans Notch', sans-serif" font-size="12" fill="#E2E8F0">unit_id / quiz_score</text>
        <text x="390" y="23" font-family="'Stack Sans Notch', sans-serif" font-size="11" fill="#94A3B8" text-anchor="end">INT (0-10)</text>
      </g>
      <g transform="translate(0, 142)">
        <rect width="400" height="36" rx="4" fill="#0B1324" stroke="#334155"/>
        <text x="20" y="23" font-family="'Stack Sans Notch', sans-serif" font-size="12" fill="#E2E8F0">time_seconds</text>
        <text x="390" y="23" font-family="'Stack Sans Notch', sans-serif" font-size="11" fill="#94A3B8" text-anchor="end">DOUBLE PRECISION</text>
      </g>
      <g transform="translate(0, 184)">
        <rect width="400" height="36" rx="4" fill="#0B1324" stroke="#334155"/>
        <text x="20" y="23" font-family="'Stack Sans Notch', sans-serif" font-size="12" fill="#E2E8F0">is_passed</text>
        <text x="390" y="23" font-family="'Stack Sans Notch', sans-serif" font-size="11" fill="#94A3B8" text-anchor="end">BOOLEAN (TRUE/FALSE)</text>
      </g>
    </g>

    <!-- Table Details -->
    <g transform="translate(25, 310)">
      <text x="0" y="20" font-family="'Mitr', sans-serif" font-size="14.5" font-weight="600" fill="#34D399">ความสัมพันธ์และการสืบค้น:</text>
      <text x="0" y="50" font-family="'Mitr', sans-serif" font-size="13" fill="#CBD5E1">• student_id เชื่อมโยงกลับไปยังตารางหลัก</text>
      <text x="0" y="76" font-family="'Mitr', sans-serif" font-size="13" fill="#CBD5E1">• ผู้เรียน 1 คนมีประวัติบันทึกคะแนนได้หลายรายการ</text>
      <text x="0" y="102" font-family="'Mitr', sans-serif" font-size="13" fill="#CBD5E1">• คำสั่ง JOIN: รวมตารางเพื่อออกใบประกาศนียบัตร</text>
      <rect x="0" y="140" width="390" height="42" rx="8" fill="#1E293B" stroke="#334155"/>
      <text x="195" y="167" font-family="'Mitr', sans-serif" font-size="13" font-weight="500" fill="#A7F3D0" text-anchor="middle">ตารางประวัติกิจกรรม (Transaction Entity)</text>
    </g>
  </g>

</svg>