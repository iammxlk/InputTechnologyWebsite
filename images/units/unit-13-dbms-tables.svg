<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad13" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8F1FC"/>
      <stop offset="100%" stop-color="#CDE0F7"/>
    </linearGradient>
    <linearGradient id="gridGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow13" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F2B5C" flood-opacity="0.18"/>
    </filter>
    <filter id="glow13">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sky Ground Background -->
  <rect width="1280" height="720" fill="url(#bgGrad13)"/>

  <!-- Floating Island Base (Isometric Voxel Slab) -->
  <g transform="translate(640, 420)" filter="url(#shadow13)">
    <!-- Island Dirt / Stone Base -->
    <path d="M 0 100 L 420 -110 L 420 -60 L 0 150 L -420 -60 L -420 -110 Z" fill="#6B7280"/>
    <path d="M 0 150 L 420 -60 L 420 -20 L 0 190 L -420 -20 L -420 -60 Z" fill="#4B5563"/>
    <path d="M 0 190 L 420 -20 L 420 20 L 0 230 L -420 20 L -420 -20 Z" fill="#374151"/>

    <!-- Island Top Surface (Tech White & Grass Tile) -->
    <path d="M 0 -220 L 420 -10 Z 0 200 L -420 -10 Z" fill="#E2E8F0"/>
    <path d="M 0 -220 L 420 -10 L 0 200 Z" fill="#F1F5F9"/>
    <path d="M 0 -220 L -420 -10 L 0 200 Z" fill="#E2E8F0"/>

    <!-- Isometric Grid Lines on Top Surface -->
    <path d="M -300 -70 L 120 140 M -180 -130 L 240 80 M -60 -190 L 360 20" stroke="#CBD5E1" stroke-width="2"/>
    <path d="M 300 -70 L -120 140 M 180 -130 L -240 80 M 60 -190 L -360 20" stroke="#CBD5E1" stroke-width="2"/>

    <!-- Table A: Voxel Chests Grid (Left Relation Entity) -->
    <g transform="translate(-220, 20)">
      <!-- Voxel Chest 1 -->
      <g transform="translate(0, -60)">
        <polygon points="0,-24 36,-4 0,16 -36,-4" fill="#60A5FA"/>
        <polygon points="0,16 36,-4 36,36 0,56" fill="#2563EB"/>
        <polygon points="0,16 -36,-4 -36,36 0,56" fill="#1D4ED8"/>
        <!-- Chest Latch -->
        <polygon points="0,6 8,1 8,16 0,21" fill="#FDE047"/>
      </g>
      <!-- Voxel Chest 2 -->
      <g transform="translate(60, -30)">
        <polygon points="0,-24 36,-4 0,16 -36,-4" fill="#93C5FD"/>
        <polygon points="0,16 36,-4 36,36 0,56" fill="#3B82F6"/>
        <polygon points="0,16 -36,-4 -36,36 0,56" fill="#1E40AF"/>
        <polygon points="0,6 8,1 8,16 0,21" fill="#FDE047"/>
      </g>
      <!-- Voxel Chest 3 -->
      <g transform="translate(-60, -30)">
        <polygon points="0,-24 36,-4 0,16 -36,-4" fill="#93C5FD"/>
        <polygon points="0,16 36,-4 36,36 0,56" fill="#3B82F6"/>
        <polygon points="0,16 -36,-4 -36,36 0,56" fill="#1E40AF"/>
        <polygon points="0,6 8,1 8,16 0,21" fill="#FDE047"/>
      </g>
    </g>

    <!-- Table B: Voxel Chests Grid (Right Relation Entity) -->
    <g transform="translate(220, 20)">
      <g transform="translate(0, -60)">
        <polygon points="0,-24 36,-4 0,16 -36,-4" fill="#60A5FA"/>
        <polygon points="0,16 36,-4 36,36 0,56" fill="#2563EB"/>
        <polygon points="0,16 -36,-4 -36,36 0,56" fill="#1D4ED8"/>
        <polygon points="0,6 8,1 8,16 0,21" fill="#FDE047"/>
      </g>
      <g transform="translate(60, -30)">
        <polygon points="0,-24 36,-4 0,16 -36,-4" fill="#93C5FD"/>
        <polygon points="0,16 36,-4 36,36 0,56" fill="#3B82F6"/>
        <polygon points="0,16 -36,-4 -36,36 0,56" fill="#1E40AF"/>
        <polygon points="0,6 8,1 8,16 0,21" fill="#FDE047"/>
      </g>
      <g transform="translate(-60, -30)">
        <polygon points="0,-24 36,-4 0,16 -36,-4" fill="#93C5FD"/>
        <polygon points="0,16 36,-4 36,36 0,56" fill="#3B82F6"/>
        <polygon points="0,16 -36,-4 -36,36 0,56" fill="#1E40AF"/>
        <polygon points="0,6 8,1 8,16 0,21" fill="#FDE047"/>
      </g>
    </g>

    <!-- Central Glowing Database Crystal Server -->
    <g transform="translate(0, -70)">
      <!-- Pedestal Obsidian Base -->
      <polygon points="0,-20 60,-50 120,-20 60,10" fill="#1E293B"/>
      <polygon points="0,-20 -60,-50 -120,-20 -60,10" fill="#0F172A"/>
      <polygon points="0,-20 60,10 0,40 -60,10" fill="#334155"/>

      <!-- Floating Glowing Diamond/Lapis Relational Crystal -->
      <g filter="url(#glow13)">
        <polygon points="0,-140 40,-80 0,-20 -40,-80" fill="#38BDF8" opacity="0.95"/>
        <polygon points="0,-140 40,-80 0,-70" fill="#7DD3FC"/>
        <polygon points="0,-140 -40,-80 0,-70" fill="#0284C7"/>
        <polygon points="0,-20 40,-80 0,-70" fill="#0369A1"/>
        <polygon points="0,-20 -40,-80 0,-70" fill="#0C4A6E"/>
      </g>
    </g>

    <!-- Primary-Foreign Key Relational Beams (Connecting Table A <-> Server <-> Table B) -->
    <g filter="url(#glow13)">
      <path d="M -160 -10 C -90 -40, -50 -50, 0 -60" fill="none" stroke="#00E5FF" stroke-width="4" stroke-dasharray="8 6"/>
      <path d="M 160 -10 C 90 -40, 50 -50, 0 -60" fill="none" stroke="#00E5FF" stroke-width="4" stroke-dasharray="8 6"/>
      <!-- Glowing Key Tokens at Endpoints -->
      <circle cx="-160" cy="-10" r="7" fill="#FACC15"/>
      <circle cx="160" cy="-10" r="7" fill="#FACC15"/>
      <circle cx="0" cy="-60" r="9" fill="#38BDF8"/>
    </g>
  </g>
</svg>
