<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Technical Grid Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4 8" opacity="0.3">
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="640" x2="1280" y2="640"/>
    <line x1="330" y1="0" x2="330" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="950" y1="0" x2="950" y2="720"/>
  </g>


  <rect x="50" y="24" width="1180" height="74" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="80" y="52" font-family="'Stack Sans Notch', sans-serif" font-size="17" font-weight="700" fill="#38BDF8">
    CHARACTER ENCODING &amp; BINARY TRANSLATION PIPELINE
  </text>
  <text x="80" y="78" font-family="'Mitr', sans-serif" font-size="13" font-weight="400" fill="#94A3B8">
    กระบวนการแปลงอักขระภาษามนุษย์สู่รหัสคอมพิวเตอร์ ASCII / Unicode / UTF-8
  </text>

  <!-- STEP 1: Human Glyph Symbol -->
  <g transform="translate(50, 115)" filter="url(#cardShadow)">
    <rect width="270" height="565" rx="12" fill="#131E36" stroke="#2563EB" stroke-width="1.8"/>
    <rect width="270" height="46" rx="12" fill="#1E293B"/>
    <rect x="14" y="9" width="76" height="28" rx="6" fill="#2563EB"/>
    <text x="52" y="28" font-family="'Stack Sans Notch', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">STEP 01</text>
    <text x="100" y="29" font-family="'Mitr', sans-serif" font-size="14.5" font-weight="600" fill="#FFFFFF">Human Glyph</text>
    <g transform="translate(14, 58)">
      <rect width="242" height="150" rx="8" fill="#0B1324" stroke="#1E293B"/>
      <!-- Characters A and Ko Kai -->
      <g transform="translate(50, 25)">
        <rect width="60" height="60" rx="6" fill="#1E293B" stroke="#38BDF8"/>
        <text x="30" y="42" font-family="'Stack Sans Notch', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">A</text>
        <rect x="80" y="0" width="60" height="60" rx="6" fill="#1E293B" stroke="#60A5FA"/>
        <text x="110" y="42" font-family="'Mitr', sans-serif" font-size="28" font-weight="600" fill="#FFFFFF" text-anchor="middle">ก</text>
      </g>
      <text x="121" y="125" font-family="'Mitr', sans-serif" font-size="11.5" fill="#E2E8F0" text-anchor="middle">อักขระภาษามนุษย์ที่พิมพ์จากแป้น</text>
    </g>
    <g transform="translate(16, 230)">
      <text x="0" y="16" font-family="'Mitr', sans-serif" font-size="13.5" font-weight="600" fill="#38BDF8">สัญลักษณ์ต้นทาง:</text>
      <text x="0" y="42" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• ผู้ใช้พิมพ์ตัวอักษร 'A' หรือ 'ก'</text>
      <text x="0" y="68" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• คอมพิวเตอร์ไม่เข้าใจความหมาย</text>
      <text x="0" y="94" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• ต้องมีมาตรฐานการจับคู่สัญลักษณ์</text>
      <text x="0" y="120" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• มนุษย์ใช้ฟอนต์เพื่อเรนเดอร์ภาพ</text>
      <rect x="0" y="270" width="238" height="36" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="119" y="293" font-family="'Mitr', sans-serif" font-size="12.5" fill="#93C5FD" text-anchor="middle">สัญลักษณ์ทางภาษาศาสตร์</text>
    </g>
  </g>

  <!-- Arrow 1->2 -->
  <g transform="translate(328, 380)"><circle cx="10" cy="0" r="13" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/><path d="M 6 -5 L 14 0 L 6 5" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/></g>

  <!-- STEP 2: Unicode Code Point Assignment -->
  <g transform="translate(350, 115)" filter="url(#cardShadow)">
    <rect width="270" height="565" rx="12" fill="#131E36" stroke="#0284C7" stroke-width="1.8"/>
    <rect width="270" height="46" rx="12" fill="#1E293B"/>
    <rect x="14" y="9" width="76" height="28" rx="6" fill="#0284C7"/>
    <text x="52" y="28" font-family="'Stack Sans Notch', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">STEP 02</text>
    <text x="100" y="29" font-family="'Mitr', sans-serif" font-size="14.5" font-weight="600" fill="#FFFFFF">Unicode Point</text>
    <g transform="translate(14, 58)">
      <rect width="242" height="150" rx="8" fill="#0B1324" stroke="#1E293B"/>
      <!-- Unicode tables -->
      <g transform="translate(20, 20)">
        <rect width="202" height="40" rx="4" fill="#1E293B" stroke="#0284C7"/>
        <text x="101" y="25" font-family="'Stack Sans Notch', sans-serif" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle">'A' = U+0041 (Dec 65)</text>
        <rect y="50" width="202" height="40" rx="4" fill="#1E293B" stroke="#38BDF8"/>
        <text x="101" y="75" font-family="'Stack Sans Notch', sans-serif" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle">'ก' = U+0E01 (Dec 3585)</text>
      </g>
      <text x="121" y="125" font-family="'Stack Sans Notch', sans-serif" font-size="10.5" fill="#CBD5E1" text-anchor="middle">ISO 10646 UNIVERSAL CHAR SET</text>
    </g>
    <g transform="translate(16, 230)">
      <text x="0" y="16" font-family="'Mitr', sans-serif" font-size="13.5" font-weight="600" fill="#38BDF8">การกำหนดจุดรหัสสากล:</text>
      <text x="0" y="42" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• Unicode กำหนดเลขรหัสไม่ซ้ำกัน</text>
      <text x="0" y="68" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• รองรับทุกภาษาในโลกกว่า 150,000 อักษร</text>
      <text x="0" y="94" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• ตัวอักษรไทยอยู่ในช่วง U+0E00-0E7F</text>
      <text x="0" y="120" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• หมดปัญหาภาษาต่างดาว (Mojibake)</text>
      <rect x="0" y="270" width="238" height="36" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="119" y="293" font-family="'Mitr', sans-serif" font-size="12.5" fill="#38BDF8" text-anchor="middle">มาตรฐาน Unicode สากล</text>
    </g>
  </g>

  <!-- Arrow 2->3 -->
  <g transform="translate(628, 380)"><circle cx="10" cy="0" r="13" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/><path d="M 6 -5 L 14 0 L 6 5" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/></g>

  <!-- STEP 3: UTF-8 Variable Byte Encoding -->
  <g transform="translate(650, 115)" filter="url(#cardShadow)">
    <rect width="270" height="565" rx="12" fill="#131E36" stroke="#10B981" stroke-width="1.8"/>
    <rect width="270" height="46" rx="12" fill="#1E293B"/>
    <rect x="14" y="9" width="76" height="28" rx="6" fill="#10B981"/>
    <text x="52" y="28" font-family="'Stack Sans Notch', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">STEP 03</text>
    <text x="100" y="29" font-family="'Mitr', sans-serif" font-size="14.5" font-weight="600" fill="#FFFFFF">UTF-8 Bytes</text>
    <g transform="translate(14, 58)">
      <rect width="242" height="150" rx="8" fill="#0B1324" stroke="#1E293B"/>
      <!-- Byte bytes -->
      <g transform="translate(20, 20)">
        <rect width="202" height="40" rx="4" fill="#1E293B" stroke="#10B981"/>
        <text x="101" y="25" font-family="'Stack Sans Notch', sans-serif" font-size="11.5" font-weight="700" fill="#34D399" text-anchor="middle">'A': 1 BYTE -> 0x41</text>
        <rect y="50" width="202" height="40" rx="4" fill="#1E293B" stroke="#10B981"/>
        <text x="101" y="75" font-family="'Stack Sans Notch', sans-serif" font-size="11.5" font-weight="700" fill="#34D399" text-anchor="middle">'ก': 3 BYTES -> E0 B8 81</text>
      </g>
      <text x="121" y="125" font-family="'Stack Sans Notch', sans-serif" font-size="10.5" fill="#CBD5E1" text-anchor="middle">VARIABLE LENGTH (1 - 4 BYTES)</text>
    </g>
    <g transform="translate(16, 230)">
      <text x="0" y="16" font-family="'Mitr', sans-serif" font-size="13.5" font-weight="600" fill="#34D399">การเข้ารหัสไบต์แบบยืดหยุ่น:</text>
      <text x="0" y="42" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• UTF-8 ประหยัดพื้นที่จัดเก็บ</text>
      <text x="0" y="68" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• อักษรภาษาอังกฤษใช้เพียง 1 ไบต์</text>
      <text x="0" y="94" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• ภาษาไทย 'ก' ใช้ 3 ไบต์ (E0 B8 81)</text>
      <text x="0" y="120" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• ใช้งานร่วมกับ ASCII ยุคเก่าได้ 100%</text>
      <rect x="0" y="270" width="238" height="36" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="119" y="293" font-family="'Mitr', sans-serif" font-size="12.5" fill="#A7F3D0" text-anchor="middle">มาตรฐานเว็บสากล UTF-8</text>
    </g>
  </g>

  <!-- Arrow 3->4 -->
  <g transform="translate(928, 380)"><circle cx="10" cy="0" r="13" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/><path d="M 6 -5 L 14 0 L 6 5" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/></g>

  <!-- STEP 4: Silicon Binary Voltage Pulse -->
  <g transform="translate(950, 115)" filter="url(#cardShadow)">
    <rect width="280" height="565" rx="12" fill="#131E36" stroke="#F59E0B" stroke-width="1.8"/>
    <rect width="280" height="46" rx="12" fill="#1E293B"/>
    <rect x="14" y="9" width="76" height="28" rx="6" fill="#F59E0B"/>
    <text x="52" y="28" font-family="'Stack Sans Notch', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">STEP 04</text>
    <text x="100" y="29" font-family="'Mitr', sans-serif" font-size="14.5" font-weight="600" fill="#FFFFFF">Silicon Binary</text>
    <g transform="translate(14, 58)">
      <rect width="252" height="150" rx="8" fill="#0B1324" stroke="#1E293B"/>
      <!-- Binary waveform in chip -->
      <g transform="translate(25, 25)">
        <rect width="202" height="45" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
        <text x="101" y="26" font-family="'Stack Sans Notch', sans-serif" font-size="12" font-weight="700" fill="#FBBF24" text-anchor="middle">01000001 (8-BIT 'A')</text>
        <text x="101" y="40" font-family="'Stack Sans Notch', sans-serif" font-size="9" fill="#CBD5E1" text-anchor="middle">11100000 10111000 10000001 ('ก')</text>
      </g>
      <text x="126" y="115" font-family="'Stack Sans Notch', sans-serif" font-size="11" fill="#34D399" text-anchor="middle">HIGH (+3.3V) / LOW (0V) PULSES</text>
    </g>
    <g transform="translate(16, 230)">
      <text x="0" y="16" font-family="'Mitr', sans-serif" font-size="13.5" font-weight="600" fill="#FBBF24">กระแสไฟในชิปซิลิคอน:</text>
      <text x="0" y="42" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• แปลงไบต์เป็นสตรีมบิต 0 และ 1</text>
      <text x="0" y="68" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• บิต 1 = มีแรงดันไฟฟ้า High (+3.3V)</text>
      <text x="0" y="94" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• บิต 0 = ไม่มีแรงดัน Low (0V)</text>
      <text x="0" y="120" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• วิ่งผ่านทรานซิสเตอร์หลายพันล้านตัว</text>
      <rect x="0" y="270" width="248" height="36" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="124" y="293" font-family="'Mitr', sans-serif" font-size="12.5" fill="#FDE68A" text-anchor="middle">ระดับฮาร์ดแวร์พื้นฐานที่สุด</text>
    </g>
  </g>

</svg>