<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad15" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EAF2FC"/>
      <stop offset="100%" stop-color="#CEE1F8"/>
    </linearGradient>
    <filter id="shadow15" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F2B5C" flood-opacity="0.18"/>
    </filter>
    <filter id="glow15">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad15)"/>

  <g transform="translate(640, 420)" filter="url(#shadow15)">
    <!-- Isometric Floating Base Platform -->
    <path d="M 0 100 L 420 -110 L 420 -60 L 0 150 L -420 -60 L -420 -110 Z" fill="#64748B"/>
    <path d="M 0 150 L 420 -60 L 420 -20 L 0 190 L -420 -20 L -420 -60 Z" fill="#475569"/>
    <path d="M 0 -220 L 420 -10 L 0 200 L -420 -10 Z" fill="#F8FAFC"/>
    <path d="M 0 -220 L -420 -10 L 0 200 Z" fill="#E2E8F0"/>

    <!-- Left Side: Binary Bits Input Track (Glowing 0 and 1 Voxel Lamps) -->
    <g transform="translate(-240, -40)">
      <!-- Track Platform -->
      <polygon points="-80,-40 60,30 60,50 -80,-20" fill="#334155"/>

      <!-- Bit Block 1 (Glowing Cyan Voxel Cube) -->
      <g transform="translate(-40, -10)" filter="url(#glow15)">
        <polygon points="0,-20 25,-8 0,5 -25,-8" fill="#38BDF8"/>
        <polygon points="0,5 25,-8 25,18 0,30" fill="#0284C7"/>
        <polygon points="0,5 -25,-8 -25,18 0,30" fill="#0369A1"/>
      </g>
      <!-- Bit Block 0 (Dark Blue Off-State Voxel Cube) -->
      <g transform="translate(10, 15)">
        <polygon points="0,-20 25,-8 0,5 -25,-8" fill="#64748B"/>
        <polygon points="0,5 25,-8 25,18 0,30" fill="#334155"/>
        <polygon points="0,5 -25,-8 -25,18 0,30" fill="#1E293B"/>
      </g>
    </g>

    <!-- Center: Voxel Translation Prism (Encoding Engine: UTF-8 / ASCII / Base64) -->
    <g transform="translate(0, -70)">
      <!-- Pedestal Stand -->
      <polygon points="0,-15 50,-40 100,-15 50,10" fill="#1E293B"/>
      <polygon points="0,-15 -50,-40 -100,-15 -50,10" fill="#0F172A"/>

      <!-- Glowing Crystal Converter Prism -->
      <g filter="url(#glow15)">
        <polygon points="0,-130 50,-70 0,-10 -50,-70" fill="#818CF8" opacity="0.85"/>
        <polygon points="0,-130 50,-70 0,-60" fill="#A5B4FC"/>
        <polygon points="0,-130 -50,-70 0,-60" fill="#6366F1"/>
        <polygon points="0,-10 50,-70 0,-60" fill="#4F46E5"/>
        <polygon points="0,-10 -50,-70 0,-60" fill="#3730A3"/>
      </g>

      <!-- Connecting Redstone/Logic Signal Beams -->
      <path d="M -160 30 C -80 0, -40 -30, 0 -60" fill="none" stroke="#00E5FF" stroke-width="4" stroke-dasharray="8 4" filter="url(#glow15)"/>
      <path d="M 0 -60 C 40 -30, 80 0, 160 30" fill="none" stroke="#6366F1" stroke-width="4" stroke-dasharray="8 4" filter="url(#glow15)"/>
    </g>

    <!-- Right Side: Standard Encoded Character Output Blocks (Color-coded Byte Blocks) -->
    <g transform="translate(240, -40)">
      <polygon points="-60,-30 80,40 80,60 -60,-10" fill="#334155"/>

      <!-- Encoded Byte Block A (Vibrant Indigo Voxel Cube) -->
      <g transform="translate(-10, -10)" filter="url(#glow15)">
        <polygon points="0,-22 28,-8 0,6 -28,-8" fill="#C7D2FE"/>
        <polygon points="0,6 28,-8 28,20 0,34" fill="#6366F1"/>
        <polygon points="0,6 -28,-8 -28,20 0,34" fill="#4338CA"/>
      </g>

      <!-- Encoded Byte Block B (Vibrant Blue Voxel Cube) -->
      <g transform="translate(45, 18)" filter="url(#glow15)">
        <polygon points="0,-22 28,-8 0,6 -28,-8" fill="#BAE6FD"/>
        <polygon points="0,6 28,-8 28,20 0,34" fill="#0284C7"/>
        <polygon points="0,6 -28,-8 -28,20 0,34" fill="#0369A1"/>
      </g>
    </g>
  </g>
</svg>
