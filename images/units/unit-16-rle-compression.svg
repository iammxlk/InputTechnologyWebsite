<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad16" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EBF3FC"/>
      <stop offset="100%" stop-color="#D0E3F9"/>
    </linearGradient>
    <filter id="shadow16" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F2B5C" flood-opacity="0.18"/>
    </filter>
    <filter id="glow16">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad16)"/>

  <g transform="translate(640, 420)" filter="url(#shadow16)">
    <!-- Isometric Floating Base Platform -->
    <path d="M 0 100 L 420 -110 L 420 -60 L 0 150 L -420 -60 L -420 -110 Z" fill="#64748B"/>
    <path d="M 0 150 L 420 -60 L 420 -20 L 0 190 L -420 -20 L -420 -60 Z" fill="#475569"/>
    <path d="M 0 -220 L 420 -10 L 0 200 L -420 -10 Z" fill="#F8FAFC"/>
    <path d="M 0 -220 L -420 -10 L 0 200 Z" fill="#E2E8F0"/>

    <!-- Left Side: Uncompressed Data Sequence (Long row of 6 identical cyan voxel blocks) -->
    <g transform="translate(-260, -40)">
      <polygon points="-80,-40 60,30 60,50 -80,-20" fill="#334155"/>
      <!-- Block 1 -->
      <g transform="translate(-50, -25)">
        <polygon points="0,-16 20,-6 0,4 -20,-6" fill="#7DD3FC"/>
        <polygon points="0,4 20,-6 20,14 0,24" fill="#0284C7"/>
        <polygon points="0,4 -20,-6 -20,14 0,24" fill="#0369A1"/>
      </g>
      <!-- Block 2 -->
      <g transform="translate(-20, -10)">
        <polygon points="0,-16 20,-6 0,4 -20,-6" fill="#7DD3FC"/>
        <polygon points="0,4 20,-6 20,14 0,24" fill="#0284C7"/>
        <polygon points="0,4 -20,-6 -20,14 0,24" fill="#0369A1"/>
      </g>
      <!-- Block 3 -->
      <g transform="translate(10, 5)">
        <polygon points="0,-16 20,-6 0,4 -20,-6" fill="#7DD3FC"/>
        <polygon points="0,4 20,-6 20,14 0,24" fill="#0284C7"/>
        <polygon points="0,4 -20,-6 -20,14 0,24" fill="#0369A1"/>
      </g>
      <!-- Block 4 -->
      <g transform="translate(40, 20)">
        <polygon points="0,-16 20,-6 0,4 -20,-6" fill="#7DD3FC"/>
        <polygon points="0,4 20,-6 20,14 0,24" fill="#0284C7"/>
        <polygon points="0,4 -20,-6 -20,14 0,24" fill="#0369A1"/>
      </g>
    </g>

    <!-- Center: Mechanical Voxel Piston Compressor (Compressing Data Stream) -->
    <g transform="translate(0, -90)">
      <!-- Top Piston Mount -->
      <polygon points="0,-70 50,-95 100,-70 50,-45" fill="#1E293B"/>
      <polygon points="0,-70 -50,-95 -100,-70 -50,-45" fill="#0F172A"/>

      <!-- Piston Arm Shaft -->
      <polygon points="-15,-50 15,-50 15,10 -15,10" fill="#94A3B8"/>

      <!-- Piston Wooden/Iron Head (Pressing Downwards) -->
      <polygon points="0,-5 50,-30 0,-55 -50,-30" fill="#D97706"/>
      <polygon points="0,-5 50,-30 50,-15 0,10" fill="#B45309"/>
      <polygon points="0,-5 -50,-30 -50,-15 0,10" fill="#92400E"/>

      <!-- Compression Energy Aura -->
      <g filter="url(#glow16)">
        <ellipse cx="0" cy="20" rx="45" ry="15" fill="#00E5FF" opacity="0.6"/>
        <line x1="-35" y1="20" x2="35" y2="20" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="4 4"/>
      </g>
    </g>

    <!-- Right Side: Compressed Compact Package (Single High-Density Voxel Crate with Golden Run-Length Token) -->
    <g transform="translate(240, -40)">
      <polygon points="-60,-30 80,40 80,60 -60,-10" fill="#334155"/>

      <!-- Ultra-Compact High Density Compressed Block -->
      <g transform="translate(10, 5)" filter="url(#glow16)">
        <polygon points="0,-26 34,-10 0,7 -34,-10" fill="#38BDF8"/>
        <polygon points="0,7 34,-10 34,24 0,41" fill="#0284C7"/>
        <polygon points="0,7 -34,-10 -34,24 0,41" fill="#0C4A6E"/>

        <!-- Golden Run-Length Multiplier Token atop the compressed block -->
        <g transform="translate(0, -32)">
          <circle cx="0" cy="0" r="14" fill="#FACC15"/>
          <circle cx="0" cy="0" r="10" fill="#FEF08A"/>
        </g>
      </g>
    </g>
  </g>
</svg>
