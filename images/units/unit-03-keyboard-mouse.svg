<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Technical Grid Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4 8" opacity="0.3">
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="640" x2="1280" y2="640"/>
    <line x1="330" y1="0" x2="330" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="950" y1="0" x2="950" y2="720"/>
  </g>


  <rect x="50" y="24" width="1180" height="74" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="80" y="52" font-family="'Stack Sans Notch', sans-serif" font-size="17" font-weight="700" fill="#38BDF8">
    KEYBOARD SWITCH MATRIX &amp; OPTICAL MOUSE SENSING
  </text>
  <text x="80" y="78" font-family="'Mitr', sans-serif" font-size="13" font-weight="400" fill="#94A3B8">
    กลไกการสแกนสวิตช์แป้นพิมพ์และระบบคำนวณเวกเตอร์เมาส์ออปติคอล
  </text>

  <!-- STEP 1: Matrix Switch Contact -->
  <g transform="translate(50, 115)" filter="url(#cardShadow)">
    <rect width="270" height="565" rx="12" fill="#131E36" stroke="#2563EB" stroke-width="1.8"/>
    <rect width="270" height="46" rx="12" fill="#1E293B"/>
    <rect x="14" y="9" width="76" height="28" rx="6" fill="#2563EB"/>
    <text x="52" y="28" font-family="'Stack Sans Notch', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">STEP 01</text>
    <text x="100" y="29" font-family="'Mitr', sans-serif" font-size="14.5" font-weight="600" fill="#FFFFFF">Matrix Grid Scan</text>
    <g transform="translate(14, 58)">
      <rect width="242" height="150" rx="8" fill="#0B1324" stroke="#1E293B"/>
      <!-- Grid schematic -->
      <line x1="30" y1="40" x2="210" y2="40" stroke="#38BDF8" stroke-width="2"/>
      <line x1="30" y1="75" x2="210" y2="75" stroke="#38BDF8" stroke-width="2"/>
      <line x1="30" y1="110" x2="210" y2="110" stroke="#38BDF8" stroke-width="2"/>
      <line x1="75" y1="20" x2="75" y2="130" stroke="#60A5FA" stroke-width="2"/>
      <line x1="120" y1="20" x2="120" y2="130" stroke="#60A5FA" stroke-width="2"/>
      <line x1="165" y1="20" x2="165" y2="130" stroke="#60A5FA" stroke-width="2"/>
      <!-- Active Switch Point -->
      <circle cx="120" cy="75" r="7" fill="#EF4444" stroke="#FFFFFF" stroke-width="1.5"/>
      <text x="120" y="142" font-family="'Stack Sans Notch', sans-serif" font-size="10.5" fill="#F87171" text-anchor="middle">ACTIVE CONTACT (ROW 2, COL 2)</text>
    </g>
    <g transform="translate(16, 230)">
      <text x="0" y="16" font-family="'Mitr', sans-serif" font-size="13.5" font-weight="600" fill="#38BDF8">การตรวจจับจุดตัดเมทริกซ์:</text>
      <text x="0" y="42" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• ปล่อยพัลส์ไฟสลับ Row Strobe</text>
      <text x="0" y="68" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• ตรวจสอบแรงดันใน Column Lines</text>
      <text x="0" y="94" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• วงจร Debounce กรองการเด้งซ้ำ</text>
      <text x="0" y="120" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• บันทึกพิกัดสวิตช์ที่ถูกกด</text>
      <rect x="0" y="270" width="238" height="36" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="119" y="293" font-family="'Mitr', sans-serif" font-size="12.5" fill="#93C5FD" text-anchor="middle">ความเร็วสแกน: 1,000 รอบ/วินาที</text>
    </g>
  </g>

  <!-- Arrow 1->2 -->
  <g transform="translate(328, 380)"><circle cx="10" cy="0" r="13" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/><path d="M 6 -5 L 14 0 L 6 5" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/></g>

  <!-- STEP 2: MCU Scan Code Generation -->
  <g transform="translate(350, 115)" filter="url(#cardShadow)">
    <rect width="270" height="565" rx="12" fill="#131E36" stroke="#0284C7" stroke-width="1.8"/>
    <rect width="270" height="46" rx="12" fill="#1E293B"/>
    <rect x="14" y="9" width="76" height="28" rx="6" fill="#0284C7"/>
    <text x="52" y="28" font-family="'Stack Sans Notch', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">STEP 02</text>
    <text x="100" y="29" font-family="'Mitr', sans-serif" font-size="14.5" font-weight="600" fill="#FFFFFF">Scan Code MCU</text>
    <g transform="translate(14, 58)">
      <rect width="242" height="150" rx="8" fill="#0B1324" stroke="#1E293B"/>
      <!-- Chip Diagram -->
      <rect x="50" y="25" width="142" height="60" rx="4" fill="#1E293B" stroke="#0284C7" stroke-width="1.5"/>
      <text x="121" y="48" font-family="'Stack Sans Notch', sans-serif" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle">ARM CORTEX MCU</text>
      <text x="121" y="68" font-family="'Stack Sans Notch', sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">MAKE CODE: 0x1E ('A')</text>
      <rect x="20" y="100" width="202" height="30" rx="4" fill="#0F172A" stroke="#334155"/>
      <text x="121" y="120" font-family="'Stack Sans Notch', sans-serif" font-size="11" fill="#CBD5E1" text-anchor="middle">USB HID 8-BYTE PACKET</text>
    </g>
    <g transform="translate(16, 230)">
      <text x="0" y="16" font-family="'Mitr', sans-serif" font-size="13.5" font-weight="600" fill="#38BDF8">การแปลงเป็นสแกนโค้ด:</text>
      <text x="0" y="42" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• MCU ตีความพิกัดเมทริกซ์</text>
      <text x="0" y="68" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• สร้าง Make Code เมื่อกดปุ่ม</text>
      <text x="0" y="94" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• สร้าง Break Code เมื่อปล่อยปุ่ม</text>
      <text x="0" y="120" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• แพ็กเกจข้อมูล USB HID ส่งเข้าโฮสต์</text>
      <rect x="0" y="270" width="238" height="36" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="119" y="293" font-family="'Mitr', sans-serif" font-size="12.5" fill="#38BDF8" text-anchor="middle">N-Key Rollover (NKRO) รองรับ</text>
    </g>
  </g>

  <!-- Arrow 2->3 -->
  <g transform="translate(628, 380)"><circle cx="10" cy="0" r="13" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/><path d="M 6 -5 L 14 0 L 6 5" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/></g>

  <!-- STEP 3: Optical Mouse Sensor (DSP) -->
  <g transform="translate(650, 115)" filter="url(#cardShadow)">
    <rect width="270" height="565" rx="12" fill="#131E36" stroke="#10B981" stroke-width="1.8"/>
    <rect width="270" height="46" rx="12" fill="#1E293B"/>
    <rect x="14" y="9" width="76" height="28" rx="6" fill="#10B981"/>
    <text x="52" y="28" font-family="'Stack Sans Notch', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">STEP 03</text>
    <text x="100" y="29" font-family="'Mitr', sans-serif" font-size="14.5" font-weight="600" fill="#FFFFFF">Optical CMOS DSP</text>
    <g transform="translate(14, 58)">
      <rect width="242" height="150" rx="8" fill="#0B1324" stroke="#1E293B"/>
      <!-- Optical camera ray -->
      <polygon points="121,20 70,80 172,80" fill="#EF4444" fill-opacity="0.15" stroke="#EF4444" stroke-width="1" stroke-dasharray="3 3"/>
      <circle cx="121" cy="20" r="8" fill="#EF4444"/>
      <text x="121" y="105" font-family="'Stack Sans Notch', sans-serif" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">CMOS SENSOR 4,000 FPS</text>
      <text x="121" y="125" font-family="'Stack Sans Notch', sans-serif" font-size="10.5" fill="#94A3B8" text-anchor="middle">DELTA X = +14, DELTA Y = -8</text>
    </g>
    <g transform="translate(16, 230)">
      <text x="0" y="16" font-family="'Mitr', sans-serif" font-size="13.5" font-weight="600" fill="#34D399">การประมวลผลเซนเซอร์เมาส์:</text>
      <text x="0" y="42" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• LED/Laser ฉายแสงลงบนพื้นผิว</text>
      <text x="0" y="68" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• กล้อง CMOS ถ่ายภาพหลายพันเฟรม</text>
      <text x="0" y="94" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• ชิป DSP เปรียบเทียบภาพต่อเนื่อง</text>
      <text x="0" y="120" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• คำนวณเวกเตอร์ความเร็ว Delta X/Y</text>
      <rect x="0" y="270" width="238" height="36" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="119" y="293" font-family="'Mitr', sans-serif" font-size="12.5" fill="#A7F3D0" text-anchor="middle">Polling Rate: 1,000 Hz (1ms)</text>
    </g>
  </g>

  <!-- Arrow 3->4 -->
  <g transform="translate(928, 380)"><circle cx="10" cy="0" r="13" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/><path d="M 6 -5 L 14 0 L 6 5" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/></g>

  <!-- STEP 4: OS Driver &amp; Cursor Dispatch -->
  <g transform="translate(950, 115)" filter="url(#cardShadow)">
    <rect width="280" height="565" rx="12" fill="#131E36" stroke="#F59E0B" stroke-width="1.8"/>
    <rect width="280" height="46" rx="12" fill="#1E293B"/>
    <rect x="14" y="9" width="76" height="28" rx="6" fill="#F59E0B"/>
    <text x="52" y="28" font-family="'Stack Sans Notch', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">STEP 04</text>
    <text x="100" y="29" font-family="'Mitr', sans-serif" font-size="14.5" font-weight="600" fill="#FFFFFF">OS Cursor Render</text>
    <g transform="translate(14, 58)">
      <rect width="252" height="150" rx="8" fill="#0B1324" stroke="#1E293B"/>
      <!-- Screen Display with cursor -->
      <rect x="36" y="20" width="180" height="95" rx="6" fill="#1E293B" stroke="#64748B"/>
      <!-- Mouse cursor arrow icon in display -->
      <path d="M 110 50 L 110 75 L 117 69 L 124 82 L 128 80 L 121 67 L 130 67 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
      <text x="126" y="132" font-family="'Stack Sans Notch', sans-serif" font-size="11" font-weight="600" fill="#FBBF24" text-anchor="middle">GPU FRAMEBUFFER REFRESH</text>
    </g>
    <g transform="translate(16, 230)">
      <text x="0" y="16" font-family="'Mitr', sans-serif" font-size="13.5" font-weight="600" fill="#FBBF24">การเรนเดอร์บนหน้าจอ:</text>
      <text x="0" y="42" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• ไดรเวอร์ OS รับพิกัดเวกเตอร์</text>
      <text x="0" y="68" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• คำนวณ Acceleration &amp; DPI</text>
      <text x="0" y="94" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• ปรับตำแหน่งเคอร์เซอร์บนเฟรม</text>
      <text x="0" y="120" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• ส่งสัญญาณ Click Event สู่แอป</text>
      <rect x="0" y="270" width="248" height="36" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="124" y="293" font-family="'Mitr', sans-serif" font-size="12.5" fill="#FDE68A" text-anchor="middle">ตอบสนองทันที: Real-time UI</text>
    </g>
  </g>

</svg>