<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Technical Grid Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4 8" opacity="0.3">
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="640" x2="1280" y2="640"/>
    <line x1="330" y1="0" x2="330" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="950" y1="0" x2="950" y2="720"/>
  </g>


  <rect x="50" y="24" width="1180" height="74" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="80" y="52" font-family="'Stack Sans Notch', sans-serif" font-size="17" font-weight="700" fill="#38BDF8">
    2D QR CODE MATRIX ANATOMY &amp; DECODING PIPELINE
  </text>
  <text x="80" y="78" font-family="'Mitr', sans-serif" font-size="13" font-weight="400" fill="#94A3B8">
    โครงสร้างทางเทคนิคและขั้นตอนการถอดรหัสภาพคิวอาร์โค้ดสองมิติ
  </text>

  <!-- STEP 1: Image Capture &amp; Binarization -->
  <g transform="translate(50, 115)" filter="url(#cardShadow)">
    <rect width="270" height="565" rx="12" fill="#131E36" stroke="#2563EB" stroke-width="1.8"/>
    <rect width="270" height="46" rx="12" fill="#1E293B"/>
    <rect x="14" y="9" width="76" height="28" rx="6" fill="#2563EB"/>
    <text x="52" y="28" font-family="'Stack Sans Notch', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">STEP 01</text>
    <text x="100" y="29" font-family="'Mitr', sans-serif" font-size="14.5" font-weight="600" fill="#FFFFFF">Frame Binarize</text>
    <g transform="translate(14, 58)">
      <rect width="242" height="150" rx="8" fill="#0B1324" stroke="#1E293B"/>
      <!-- Camera sensor frame -->
      <rect x="40" y="15" width="162" height="100" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-dasharray="4 4"/>
      <circle cx="121" cy="65" r="30" fill="none" stroke="#EF4444" stroke-width="1.5"/>
      <line x1="80" y1="65" x2="162" y2="65" stroke="#EF4444" stroke-width="1"/>
      <line x1="121" y1="25" x2="121" y2="105" stroke="#EF4444" stroke-width="1"/>
      <text x="121" y="132" font-family="'Stack Sans Notch', sans-serif" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">GRAYSCALE TO MONOCHROME</text>
    </g>
    <g transform="translate(16, 230)">
      <text x="0" y="16" font-family="'Mitr', sans-serif" font-size="13.5" font-weight="600" fill="#38BDF8">การจับภาพและแปลงขาวดำ:</text>
      <text x="0" y="42" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• กล้อง CMOS บันทึกภาพ 2D Frame</text>
      <text x="0" y="68" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• แปลง Grayscale เป็น Monochrome</text>
      <text x="0" y="94" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• ใช้อัลกอริทึม Adaptive Threshold</text>
      <text x="0" y="120" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• กรองเงามืดและแสงสะท้อนออก</text>
      <rect x="0" y="270" width="238" height="36" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="119" y="293" font-family="'Mitr', sans-serif" font-size="12.5" fill="#93C5FD" text-anchor="middle">ภาพขาวดำบริสุทธิ์ 1-bit</text>
    </g>
  </g>

  <!-- Arrow 1->2 -->
  <g transform="translate(328, 380)"><circle cx="10" cy="0" r="13" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/><path d="M 6 -5 L 14 0 L 6 5" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/></g>

  <!-- STEP 2: Finder Patterns (1:1:3:1:1) -->
  <g transform="translate(350, 115)" filter="url(#cardShadow)">
    <rect width="270" height="565" rx="12" fill="#131E36" stroke="#0284C7" stroke-width="1.8"/>
    <rect width="270" height="46" rx="12" fill="#1E293B"/>
    <rect x="14" y="9" width="76" height="28" rx="6" fill="#0284C7"/>
    <text x="52" y="28" font-family="'Stack Sans Notch', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">STEP 02</text>
    <text x="100" y="29" font-family="'Mitr', sans-serif" font-size="14.5" font-weight="600" fill="#FFFFFF">Finder Pattern</text>
    <g transform="translate(14, 58)">
      <rect width="242" height="150" rx="8" fill="#0B1324" stroke="#1E293B"/>
      <!-- Realistic Finder Pattern Square (1:1:3:1:1) -->
      <g transform="translate(85, 20)">
        <rect x="0" y="0" width="70" height="70" fill="#FFFFFF"/>
        <rect x="0" y="0" width="70" height="70" fill="none" stroke="#000000" stroke-width="10"/>
        <rect x="20" y="20" width="30" height="30" fill="#000000"/>
      </g>
      <text x="121" y="115" font-family="'Stack Sans Notch', sans-serif" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">RATIO 1 : 1 : 3 : 1 : 1</text>
      <text x="121" y="132" font-family="'Mitr', sans-serif" font-size="10.5" fill="#94A3B8" text-anchor="middle">จุดมาร์ก 3 มุม ปรับองศาเอียง</text>
    </g>
    <g transform="translate(16, 230)">
      <text x="0" y="16" font-family="'Mitr', sans-serif" font-size="13.5" font-weight="600" fill="#38BDF8">การตรวจจับมุมและจัดองศา:</text>
      <text x="0" y="42" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• ตรวจจับสัดส่วน 1:1:3:1:1 ที่ 3 มุม</text>
      <text x="0" y="68" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• คำนวณทิศทางและมุมเอียง (Skew)</text>
      <text x="0" y="94" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• Perspective Transform ดัดภาพตรง</text>
      <text x="0" y="120" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• สแกนได้ 360 องศา ทุกทิศทาง</text>
      <rect x="0" y="270" width="238" height="36" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="119" y="293" font-family="'Mitr', sans-serif" font-size="12.5" fill="#38BDF8" text-anchor="middle">ปรับระนาบตรงอัตโนมัติ</text>
    </g>
  </g>

  <!-- Arrow 2->3 -->
  <g transform="translate(628, 380)"><circle cx="10" cy="0" r="13" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/><path d="M 6 -5 L 14 0 L 6 5" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/></g>

  <!-- STEP 3: Timing Pattern &amp; Grid Alignment -->
  <g transform="translate(650, 115)" filter="url(#cardShadow)">
    <rect width="270" height="565" rx="12" fill="#131E36" stroke="#10B981" stroke-width="1.8"/>
    <rect width="270" height="46" rx="12" fill="#1E293B"/>
    <rect x="14" y="9" width="76" height="28" rx="6" fill="#10B981"/>
    <text x="52" y="28" font-family="'Stack Sans Notch', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">STEP 03</text>
    <text x="100" y="29" font-family="'Mitr', sans-serif" font-size="14.5" font-weight="600" fill="#FFFFFF">Timing Tracks</text>
    <g transform="translate(14, 58)">
      <rect width="242" height="150" rx="8" fill="#0B1324" stroke="#1E293B"/>
      <!-- Timing grid dots -->
      <g transform="translate(35, 30)">
        <circle cx="10" cy="10" r="4" fill="#10B981"/><circle cx="30" cy="10" r="4" fill="#334155"/><circle cx="50" cy="10" r="4" fill="#10B981"/><circle cx="70" cy="10" r="4" fill="#334155"/><circle cx="90" cy="10" r="4" fill="#10B981"/><circle cx="110" cy="10" r="4" fill="#334155"/><circle cx="130" cy="10" r="4" fill="#10B981"/><circle cx="150" cy="10" r="4" fill="#334155"/>
        <circle cx="10" cy="30" r="4" fill="#334155"/><circle cx="30" cy="30" r="4" fill="#10B981"/><circle cx="50" cy="30" r="4" fill="#334155"/><circle cx="70" cy="30" r="4" fill="#10B981"/><circle cx="90" cy="30" r="4" fill="#334155"/><circle cx="110" cy="30" r="4" fill="#10B981"/><circle cx="130" cy="30" r="4" fill="#334155"/><circle cx="150" cy="30" r="4" fill="#10B981"/>
      </g>
      <text x="121" y="95" font-family="'Stack Sans Notch', sans-serif" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">TIMING PATTERN (LINE 6)</text>
      <text x="121" y="115" font-family="'Mitr', sans-serif" font-size="10.5" fill="#CBD5E1" text-anchor="middle">แถบจุดดำขาวสลับกำหนดพิกัด</text>
    </g>
    <g transform="translate(16, 230)">
      <text x="0" y="16" font-family="'Mitr', sans-serif" font-size="13.5" font-weight="600" fill="#34D399">การเทียบตารางพิกัดโมดูล:</text>
      <text x="0" y="42" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• อ่านแถบ Timing Pattern ขาวดำสลับ</text>
      <text x="0" y="68" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• ระบุขนาดตารางโมดูล (Version 1-40)</text>
      <text x="0" y="94" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• ถอดรหัส Format Information</text>
      <text x="0" y="120" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• ปลด Mask Pattern เพื่อคืนค่าบิตจริง</text>
      <rect x="0" y="270" width="238" height="36" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="119" y="293" font-family="'Mitr', sans-serif" font-size="12.5" fill="#A7F3D0" text-anchor="middle">โมดูลจัดวางตรงพิกัด 100%</text>
    </g>
  </g>

  <!-- Arrow 3->4 -->
  <g transform="translate(928, 380)"><circle cx="10" cy="0" r="13" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/><path d="M 6 -5 L 14 0 L 6 5" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/></g>

  <!-- STEP 4: Reed-Solomon Error Correction -->
  <g transform="translate(950, 115)" filter="url(#cardShadow)">
    <rect width="280" height="565" rx="12" fill="#131E36" stroke="#F59E0B" stroke-width="1.8"/>
    <rect width="280" height="46" rx="12" fill="#1E293B"/>
    <rect x="14" y="9" width="76" height="28" rx="6" fill="#F59E0B"/>
    <text x="52" y="28" font-family="'Stack Sans Notch', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">STEP 04</text>
    <text x="100" y="29" font-family="'Mitr', sans-serif" font-size="14.5" font-weight="600" fill="#FFFFFF">Reed-Solomon</text>
    <g transform="translate(14, 58)">
      <rect width="252" height="150" rx="8" fill="#0B1324" stroke="#1E293B"/>
      <!-- Shield / Correction icon -->
      <rect x="30" y="25" width="192" height="45" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="126" y="47" font-family="'Stack Sans Notch', sans-serif" font-size="12" font-weight="700" fill="#FBBF24" text-anchor="middle">LEVEL H: 30% RECOVERY</text>
      <text x="126" y="62" font-family="'Stack Sans Notch', sans-serif" font-size="10.5" fill="#94A3B8" text-anchor="middle">แม้ภาพฉีกขาด เลอะ ก็อ่านได้</text>
      <rect x="30" y="80" width="192" height="30" rx="4" fill="#064E3B" stroke="#10B981"/>
      <text x="126" y="100" font-family="'Stack Sans Notch', sans-serif" font-size="11" font-weight="600" fill="#A7F3D0" text-anchor="middle">https://cdti.ac.th</text>
    </g>
    <g transform="translate(16, 230)">
      <text x="0" y="16" font-family="'Mitr', sans-serif" font-size="13.5" font-weight="600" fill="#FBBF24">การกู้คืนและถอดรหัสข้อความ:</text>
      <text x="0" y="42" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• ใช้อัลกอริทึม Reed-Solomon</text>
      <text x="0" y="68" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• เลือกระดับความทนทาน L, M, Q, H</text>
      <text x="0" y="94" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• กู้คืนข้อมูลแม้สูญหายได้ถึง 30%</text>
      <text x="0" y="120" font-family="'Mitr', sans-serif" font-size="12.5" fill="#CBD5E1">• แยกข้อความ URL / ตัวอักษรส่งต่อ</text>
      <rect x="0" y="270" width="248" height="36" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="124" y="293" font-family="'Mitr', sans-serif" font-size="12.5" fill="#FDE68A" text-anchor="middle">ปลอดภัย ทนทานต่อการชำรุด</text>
    </g>
  </g>

</svg>