<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>
  <g stroke="#334155" stroke-width="0.5" stroke-opacity="0.25">
    <line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/><line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>
  <rect x="36" y="28" width="310" height="32" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <circle cx="52" cy="44" r="5" fill="#38BDF8"/>
  <text x="68" y="49" fill="#38BDF8" font-family="'Stack Sans Notch', sans-serif" font-weight="700" font-size="12" letter-spacing="1">UNIT 4 HARDWARE SPECIMEN</text>
  <text x="36" y="86" fill="#F8FAFC" font-family="'Mitr', sans-serif" font-weight="600" font-size="18">4K Studio CMOS Streaming Camera & Condenser Microphone</text>
  <text x="36" y="108" fill="#94A3B8" font-family="'Mitr', sans-serif" font-size="12">เซนเซอร์รับภาพ CMOS พร้อม Bayer Filter และไมโครโฟนคอนเดนเซอร์สตูดิโอคู่กับวงจร ADC 24-bit/96kHz</text>
  
  <!-- Camera Body -->
  <g filter="url(#shadow)" transform="translate(80, 150)">
    <!-- Main Camera Body -->
    <rect x="0" y="50" width="260" height="180" rx="14" fill="#1E293B" stroke="#475569" stroke-width="2"/>
    <!-- Top Grip & Hot Shoe -->
    <rect x="30" y="25" width="80" height="25" rx="4" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
    <rect x="55" y="15" width="30" height="10" rx="2" fill="#64748B"/>
    <!-- Red Accent Ring -->
    <circle cx="160" cy="140" r="75" fill="none" stroke="#EF4444" stroke-width="2"/>
    <!-- Lens Mount & Glass Optics -->
    <circle cx="160" cy="140" r="70" fill="#0F172A" stroke="#64748B" stroke-width="3"/>
    <circle cx="160" cy="140" r="50" fill="#0284C7" opacity="0.3"/>
    <!-- Exposed CMOS Sensor in Center -->
    <rect x="135" y="115" width="50" height="50" rx="4" fill="#020617" stroke="#F59E0B" stroke-width="1.5"/>
    <!-- Bayer RGB Grid Pattern -->
    <g fill="#10B981" opacity="0.8">
      <rect x="140" y="120" width="8" height="8" rx="1" fill="#EF4444"/>
      <rect x="150" y="120" width="8" height="8" rx="1" fill="#10B981"/>
      <rect x="160" y="120" width="8" height="8" rx="1" fill="#EF4444"/>
      <rect x="170" y="120" width="8" height="8" rx="1" fill="#10B981"/>
      <rect x="140" y="130" width="8" height="8" rx="1" fill="#10B981"/>
      <rect x="150" y="130" width="8" height="8" rx="1" fill="#3B82F6"/>
      <rect x="160" y="130" width="8" height="8" rx="1" fill="#10B981"/>
      <rect x="170" y="130" width="8" height="8" rx="1" fill="#3B82F6"/>
      <rect x="140" y="140" width="8" height="8" rx="1" fill="#EF4444"/>
      <rect x="150" y="140" width="8" height="8" rx="1" fill="#10B981"/>
      <rect x="160" y="140" width="8" height="8" rx="1" fill="#EF4444"/>
      <rect x="170" y="140" width="8" height="8" rx="1" fill="#10B981"/>
      <rect x="140" y="150" width="8" height="8" rx="1" fill="#10B981"/>
      <rect x="150" y="150" width="8" height="8" rx="1" fill="#3B82F6"/>
      <rect x="160" y="150" width="8" height="8" rx="1" fill="#10B981"/>
      <rect x="170" y="150" width="8" height="8" rx="1" fill="#3B82F6"/>
    </g>
    <!-- Label -->
    <text x="130" y="260" fill="#38BDF8" font-family="'Stack Sans Notch', sans-serif" font-size="11" font-weight="700" text-anchor="middle">4K ULTRA HD CMOS SENSOR</text>
  </g>

  <!-- Studio Condenser Microphone -->
  <g filter="url(#shadow)" transform="translate(460, 140)">
    <!-- Mic Body Stand Base -->
    <ellipse cx="140" cy="300" rx="60" ry="14" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
    <rect x="134" y="210" width="12" height="90" fill="#334155" stroke="#475569" stroke-width="1"/>
    
    <!-- Shockmount Rings & Bands -->
    <circle cx="140" cy="180" r="42" fill="none" stroke="#475569" stroke-width="3"/>
    <line x1="102" y1="160" x2="120" y2="180" stroke="#EF4444" stroke-width="1.5"/>
    <line x1="178" y1="160" x2="160" y2="180" stroke="#EF4444" stroke-width="1.5"/>
    <line x1="102" y1="200" x2="120" y2="180" stroke="#EF4444" stroke-width="1.5"/>
    <line x1="178" y1="200" x2="160" y2="180" stroke="#EF4444" stroke-width="1.5"/>

    <!-- Cylindrical Metal Mic Body -->
    <rect x="120" y="110" width="40" height="90" rx="8" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
    <!-- Wire Mesh Grille -->
    <path d="M 120 110 C 120 70, 160 70, 160 110 Z" fill="#0F172A" stroke="#94A3B8" stroke-width="1.5"/>
    <g stroke="#64748B" stroke-width="0.8">
      <line x1="124" y1="88" x2="156" y2="88"/>
      <line x1="122" y1="96" x2="158" y2="96"/>
      <line x1="121" y1="104" x2="159" y2="104"/>
      <line x1="130" y1="75" x2="130" y2="110"/>
      <line x1="140" y1="72" x2="140" y2="110"/>
      <line x1="150" y1="75" x2="150" y2="110"/>
    </g>

    <!-- Circular Pop Filter -->
    <circle cx="100" cy="90" r="34" fill="#0F172A" opacity="0.4" stroke="#F59E0B" stroke-width="2"/>
    <path d="M 96 124 L 96 210 Q 96 220, 120 220" fill="none" stroke="#F59E0B" stroke-width="2"/>

    <!-- ADC Audio Sampling Stream Label -->
    <rect x="65" y="325" width="150" height="26" rx="5" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="140" y="342" fill="#34D399" font-family="'Stack Sans Notch', sans-serif" font-size="10" font-weight="700" text-anchor="middle">24-BIT / 96kHz ADC PCM</text>
  </g>

</svg>