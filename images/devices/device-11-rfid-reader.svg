<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>
  <g stroke="#334155" stroke-width="0.5" stroke-opacity="0.25">
    <line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/><line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>
  <rect x="36" y="28" width="310" height="32" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <circle cx="52" cy="44" r="5" fill="#38BDF8"/>
  <text x="68" y="49" fill="#38BDF8" font-family="'Stack Sans Notch', sans-serif" font-weight="700" font-size="12" letter-spacing="1">UNIT 11 HARDWARE SPECIMEN</text>
  <text x="36" y="86" fill="#F8FAFC" font-family="'Mitr', sans-serif" font-weight="600" font-size="18">Industrial 4-Port UHF RFID Portal Reader &amp; RFID Scanner Gun</text>
  <text x="36" y="108" fill="#94A3B8" font-family="'Mitr', sans-serif" font-size="12">เครื่องอ่านคลื่นความถี่วิทยุ UHF 860-960 MHz กำลังส่งสูงสำหรับคลังสินค้า พร้อมปืนยิง RFID และแท็กหลากหลายรูปแบบ</text>
  
  <g filter="url(#shadow)" transform="translate(80, 150)">
    <rect x="0" y="20" width="260" height="220" rx="12" fill="#1E293B" stroke="#475569" stroke-width="2"/>
    <path d="M 0 40 L -12 45 L -12 60 L 0 65 L -12 70 L -12 85 L 0 90 L -12 95 L -12 110 L 0 115" stroke="#64748B" stroke-width="2" fill="none"/>
    <rect x="30" y="45" width="200" height="70" rx="6" fill="#020617" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="45" y="70" fill="#38BDF8" font-family="'Stack Sans Notch', sans-serif" font-size="11" font-weight="700">UHF RFID PORTAL (920 MHz)</text>
    <text x="45" y="90" fill="#10B981" font-family="'Stack Sans Notch', sans-serif" font-size="10">READ SPEED: 700 TAGS/SEC</text>
    <text x="45" y="105" fill="#E2E8F0" font-family="'Stack Sans Notch', sans-serif" font-size="9">EPC CLASS 1 GEN 2 (ISO 18000-6C)</text>

    <g fill="#F59E0B" stroke="#FBBF24" stroke-width="1.2">
      <circle cx="50" cy="155" r="12"/><circle cx="50" cy="155" r="4" fill="#0F172A"/>
      <circle cx="105" cy="155" r="12"/><circle cx="105" cy="155" r="4" fill="#0F172A"/>
      <circle cx="160" cy="155" r="12"/><circle cx="160" cy="155" r="4" fill="#0F172A"/>
      <circle cx="215" cy="155" r="12"/><circle cx="215" cy="155" r="4" fill="#0F172A"/>
      <text x="50" y="185" fill="#94A3B8" font-family="'Stack Sans Notch', sans-serif" font-size="9" text-anchor="middle">ANT 1</text>
      <text x="105" y="185" fill="#94A3B8" font-family="'Stack Sans Notch', sans-serif" font-size="9" text-anchor="middle">ANT 2</text>
      <text x="160" y="185" fill="#94A3B8" font-family="'Stack Sans Notch', sans-serif" font-size="9" text-anchor="middle">ANT 3</text>
      <text x="215" y="185" fill="#94A3B8" font-family="'Stack Sans Notch', sans-serif" font-size="9" text-anchor="middle">ANT 4</text>
    </g>

    <path d="M 50 167 L 50 200 C 50 230, 20 250, -30 250" fill="none" stroke="#D97706" stroke-width="4"/>
  </g>

  <g filter="url(#shadow)" transform="translate(420, 140)">
    <path d="M 120 220 L 100 320 L 135 320 L 150 220 Z" fill="#334155" stroke="#475569" stroke-width="2"/>
    <rect x="95" y="240" width="15" height="20" rx="3" fill="#F59E0B"/>
    <rect x="70" y="120" width="140" height="110" rx="10" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
    <rect x="80" y="130" width="120" height="90" rx="4" fill="#0284C7" opacity="0.3"/>
    <text x="140" y="170" fill="#F8FAFC" font-family="'Stack Sans Notch', sans-serif" font-size="12" font-weight="700" text-anchor="middle">TAGS COUNT: 142</text>
    <rect x="180" y="80" width="25" height="180" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="230" cy="170" r="45" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4,4"/>
  </g>

  <g transform="translate(560, 310)" fill="#1E293B" stroke="#64748B" stroke-width="1.2">
    <rect x="0" y="0" width="80" height="40" rx="4"/>
    <path d="M 10 20 L 25 20 M 35 10 L 35 30 L 55 30 L 55 10 L 70 10" stroke="#F59E0B" stroke-width="1.5" fill="none"/>
    <rect x="26" y="16" width="8" height="8" fill="#F59E0B"/>
    <text x="40" y="55" fill="#94A3B8" font-family="'Mitr', sans-serif" font-size="9" text-anchor="middle">แท็กสติกเกอร์ฉลากสินค้า</text>

    <rect x="100" y="0" width="80" height="35" rx="6" fill="#334155" stroke="#F59E0B"/>
    <circle cx="110" cy="17" r="4" fill="#0F172A"/>
    <circle cx="170" cy="17" r="4" fill="#0F172A"/>
    <text x="140" y="55" fill="#94A3B8" font-family="'Mitr', sans-serif" font-size="9" text-anchor="middle">แท็กโลหะอุตสาหกรรม</text>
  </g>

</svg>