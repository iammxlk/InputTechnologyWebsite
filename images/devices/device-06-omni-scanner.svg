<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>
  <g stroke="#334155" stroke-width="0.5" stroke-opacity="0.25">
    <line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/><line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>
  <rect x="36" y="28" width="310" height="32" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <circle cx="52" cy="44" r="5" fill="#38BDF8"/>
  <text x="68" y="49" fill="#38BDF8" font-family="'Stack Sans Notch', sans-serif" font-weight="700" font-size="12" letter-spacing="1">UNIT 6 HARDWARE SPECIMEN</text>
  <text x="36" y="86" fill="#F8FAFC" font-family="'Mitr', sans-serif" font-weight="600" font-size="18">Supermarket Omnidirectional In-Counter Bioptic Scanner</text>
  <text x="36" y="108" fill="#94A3B8" font-family="'Mitr', sans-serif" font-size="12">เครื่องสแกนบาร์โค้ดเคาน์เตอร์แคชเชียร์แบบ 2 ระนาบ (Sapphire Glass + Digital Scale + 360° Laser Grid)</text>
  
  <g filter="url(#shadow)" transform="translate(180, 140)">
    <path d="M 0 240 L 440 240 L 400 120 L 40 120 Z" fill="#334155" stroke="#475569" stroke-width="2"/>
    <path d="M 40 230 L 400 230 L 375 135 L 65 135 Z" fill="#64748B" stroke="#94A3B8" stroke-width="1.5"/>
    <path d="M 120 205 L 320 205 L 305 155 L 135 155 Z" fill="#0284C7" opacity="0.35" stroke="#38BDF8" stroke-width="2"/>
    <rect x="80" y="10" width="280" height="120" rx="8" fill="#1E293B" stroke="#475569" stroke-width="2"/>
    <rect x="105" y="25" width="230" height="90" rx="4" fill="#0284C7" opacity="0.35" stroke="#38BDF8" stroke-width="2"/>

    <g stroke="#EF4444" stroke-width="1.2" opacity="0.85">
      <line x1="120" y1="35" x2="310" y2="105"/>
      <line x1="120" y1="105" x2="310" y2="35"/>
      <line x1="220" y1="25" x2="220" y2="115"/>
      <line x1="105" y1="70" x2="335" y2="70"/>
      <line x1="135" y1="155" x2="305" y2="205"/>
      <line x1="305" y1="155" x2="135" y2="205"/>
      <line x1="220" y1="155" x2="220" y2="205"/>
    </g>

    <rect x="365" y="25" width="65" height="40" rx="4" fill="#020617" stroke="#10B981" stroke-width="1"/>
    <text x="397" y="42" fill="#10B981" font-family="'Stack Sans Notch', sans-serif" font-size="10" font-weight="700" text-anchor="middle">0.450 kg</text>
    <text x="397" y="58" fill="#38BDF8" font-family="'Stack Sans Notch', sans-serif" font-size="9" text-anchor="middle">PASS LED</text>
  </g>

  <g font-family="'Mitr', sans-serif" font-size="11">
    <rect x="40" y="210" width="130" height="28" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="105" y="228" fill="#38BDF8" text-anchor="middle">กระจก Sapphire ทนรอย</text>
    <rect x="630" y="210" width="130" height="28" rx="6" fill="#0F172A" stroke="#EF4444" stroke-width="1"/>
    <text x="695" y="228" fill="#F87171" text-anchor="middle">กวาดเลเซอร์ 360 องศา</text>
    <rect x="310" y="440" width="180" height="28" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="400" y="458" fill="#34D399" text-anchor="middle">แท่นชั่งน้ำหนักดิจิทัลในตัว</text>
  </g>

